    module: 打卡方式
    summary: 手机打卡以定位或办公 WIFI 二选一作为凭证，智能考勤机限定在指定设备打卡。打卡范围以办公地点为中心，100 至 300 米有效；考勤机存在人数容量上限。
    source_ref:
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡地点与打卡范围
  - id: FP-03
    name: 审批关联与异常校准
    module: 审批校准
    summary: 请假、出差、外出、加班、补卡五类审批数据与打卡数据自动关联，匹配成功的异常打卡状态被智能校准，未匹配的保持原样。
    source_ref:
