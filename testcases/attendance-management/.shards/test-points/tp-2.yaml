      quote: 企业微信把管理员分成超级管理员与分级管理员两类，权限按「全员」与「管辖范围」划界；打卡记录则提供管理后台的筛选与 Excel 导出、以及面向开发者的 API 导出两条通道。
      path: wiki/attendance-management/permissions-and-export.md
      section: Overview
    methods:
      applicable: [等价类划分, 因果图法, 场景法]
      skipped:
        - method: 边界值法
          reason: 划界是类别归属判定，无数值阈值可取值
        - method: 错误推测法
          reason: 划界规则由概述段直接给出，无经验性风险假设可依
        - method: 穷举法
          reason: 管理员种类与部门组合数量随组织架构增长，不可穷举
        - method: 逆向场景法
          reason: 该点为正向划界判定，反向由 SC-FP-17-03 承担
        - method: 异常法
          reason: 不涉及运行时异常，只验管理员类别与范围的对应
        - method: 并发法
          reason: 单账号单次判定，无共享可变状态
        - method: 安全性法
          reason: 该点只验范围归属，越权拦截由 FP-20 单独判定

