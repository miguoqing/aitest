meta:
  topic: attendance-management
  title: 打卡管理
  stage: test-points

test_points:
  - id: TP-FP-17-01-01
    scenario_id: SC-FP-17-01
    statement: 超级管理员的规则设置范围覆盖公司全员且查看统计范围同为全员，不因部门归属被截断。
    evidence:
      quote: "| 超级管理员 | 可在管理后台和移动端给公司全员设置打卡规则 | 全员打卡统计 |"
      path: wiki/attendance-management/permissions-and-export.md
      section: 两类管理员
    methods:
      applicable: [等价类划分, 场景法, 安全性法]
      skipped:
        - method: 边界值法
          reason: 范围判定只有「全员」与「管辖范围」两个类别，无数值阈值或区间端点可取
        - method: 错误推测法
          reason: 该判定由管理员表格条款直接给出，无历史缺陷可供推测
        - method: 穷举法
          reason: 接口与部门组合数量随组织规模增长，穷举没有边界
        - method: 逆向场景法
          reason: 该点只验覆盖全员的正向路径，反向路径由 SC-FP-17-03 与 FP-20 承担
        - method: 因果图法
          reason: 管理员类型单条件即决定范围，不存在待组合的条件约束
        - method: 异常法
          reason: 该点只验范围归属，不涉及运行时异常
        - method: 并发法
          reason: 单管理员单次操作，无共享可变状态

  - id: TP-FP-17-01-02
