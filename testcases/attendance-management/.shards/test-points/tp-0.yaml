meta:
  topic: attendance-management
  title: 打卡管理
  stage: test-points

test_points:
  - id: TP-FP-01-01-01
    scenario_id: SC-FP-01-01
    statement: 固定时间上下班规则绑定的员工按企业统一时间打卡时，考勤判定取该固定时间，不取排班时间。
    evidence:
      quote: "规则类型决定考勤的统计口径（固定时间、按班次、自由上下班），打卡方式决定打卡凭证的来源（手机定位/Wi-Fi、智能考勤机、传统U盘考勤机导入）。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 三种规则类型
    methods:
      applicable: [等价类划分, 场景法, 因果图法]
      skipped:
        - method: 边界值法
          reason: 该断言判的是规则类型到判定基准的映射，没有可取的数值临界点
        - method: 错误推测法
          reason: 判定依据是文档明示的三种类型枚举，无需凭经验猜测隐藏口径
        - method: 穷举法
          reason: 类型只有三种，等价类已逐一覆盖，逐项穷举不产生新结论
        - method: 逆向场景法
          reason: 本条是正向口径校验，绕过规则类型的路径由相邻反向断言承担
        - method: 异常法
          reason: 本断言只验正常打卡时间下的判定，异常时间入参不在其范围
        - method: 并发法
          reason: 只读单人单日一条考勤结论，无共享可变状态
        - method: 安全性法
          reason: 不涉及凭证伪造、越权读取或数据越界

  - id: TP-FP-01-01-02
    scenario_id: SC-FP-01-01
    statement: 自由上下班规则下员工可随时打卡，考勤统计只计旷工，工作时长按实际打卡区间记录而不判迟到早退。
    evidence:
      quote: "自由上下班只统计旷工，工作时长仅作记录，不按固定时间判定上下班。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 三种规则类型
    methods:
      applicable: [等价类划分, 逆向场景法, 场景法]
      skipped:
        - method: 边界值法
          reason: 自由上下班不设打卡时间限制，不存在可取的迟到/早退分钟阈值
        - method: 错误推测法
          reason: 该口径由文档明示，不需要额外猜测非工作时间打卡的特殊处理
        - method: 穷举法
          reason: 打卡时刻是连续量，无法穷举，等价类按时间区间划分即可
        - method: 因果图法
          reason: 规则类型与统计结果一对一对应，无多条件组合
        - method: 异常法
          reason: 本断言只看有打卡记录时的统计结果，无记录的情况由同一场景的另一断言验
        - method: 并发法
          reason: 只读单人单日一条统计结果，无共享可变状态，并发不改变结论
        - method: 安全性法
          reason: 统计口径是规则类型到结果的映射，不涉及鉴权、越权访问或凭证校验

  - id: TP-FP-01-02-01
    scenario_id: SC-FP-01-02
    statement: 员工所在规则为自由上下班且当日完成打卡时，考勤明细中不出现迟到或早退结论。
    evidence:
      quote: "三种规则类型的统计口径不同：自由上下班不得产出迟到/早退判定，只统计旷工。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 可测试的关键判定点
    methods:
      applicable: [逆向场景法, 场景法, 等价类划分]
      skipped:
        - method: 边界值法
          reason: 该判定本身不设时间阈值，没有可取的临界分钟数
        - method: 错误推测法
          reason: 文档已把这条口径写成禁止项，无需再推测边界情况
        - method: 穷举法
          reason: 打卡时刻连续分布，穷举无意义，按三种规则类型分等价类即可
        - method: 因果图法
          reason: 单个条件（规则类型）决定单个结果（是否产出迟到早退）
        - method: 异常法
          reason: 本断言验的是正常打卡后的统计输出，不引入异常输入
        - method: 并发法
          reason: 只读取该员工当日考勤明细，无共享可变状态
        - method: 安全性法
          reason: 不涉及越权查看他人考勤或凭证伪造

  - id: TP-FP-01-02-02
    scenario_id: SC-FP-01-02
    statement: 自由上下班规则下员工当日无任何打卡记录时，系统只把该日计为旷工，不额外生成迟到或早退记录。
    evidence:
      quote: "自由上下班只统计旷工，工作时长仅作记录，不按固定时间判定上下班。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 三种规则类型
    methods:
      applicable: [逆向场景法, 异常法, 场景法]
      skipped:
        - method: 边界值法
          reason: 无打卡记录是一种离散状态，不存在连续取值上的临界点
        - method: 等价类划分
          reason: 该断言只覆盖「当日无记录」一种输入形态，再分类不产生新用例
        - method: 错误推测法
          reason: 旷工统计口径已由原文写明，无需猜测缺卡是否转为异常
        - method: 穷举法
          reason: 缺卡形态只有全缺一种，逐项穷举无新增输入
        - method: 因果图法
          reason: 缺卡与旷工是单条件单结果，无需画组合关系
        - method: 并发法
          reason: 单员工单日缺卡判定，无共享可变状态
        - method: 安全性法
          reason: 不涉及权限或凭证，纯统计口径校验

  - id: TP-FP-01-03-01
    scenario_id: SC-FP-01-03
    statement: 设备运维部门套按班次上下班、销售部套自由上下班后，销售部成员不产出迟到/早退判定，其判定不被另一条规则的口径覆盖。
    evidence:
      quote: "文档给出的典型组合是按工作性质分派：需要“三班倒”的设备运维部门套用按班次上下班，办公时间更灵活的销售部套用自由上下班。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡人员
    methods:
      applicable: [场景法, 等价类划分, 因果图法]
      skipped:
        - method: 边界值法
          reason: 该断言比较两条规则的口径归属，无数值阈值可测
        - method: 错误推测法
          reason: 分派组合由文档给出，无需猜测未列举部门的归属
        - method: 穷举法
          reason: 部门与规则类型的组合随组织架构变化，无法穷举，按类型等价类覆盖
        - method: 逆向场景法
          reason: 本条验分派后的正向口径，反向路径由同场景的另一断言承担
        - method: 异常法
          reason: 不引入异常人员或异常时间，只验口径归属
        - method: 并发法
          reason: 两条规则的判定相互独立，无共享可变状态
        - method: 安全性法
          reason: 口径隔离不是权限隔离，不涉及越权

  - id: TP-FP-01-03-02
    scenario_id: SC-FP-01-03
    statement: 同一批打卡记录在规则类型改为自由上下班后，考勤结果不再产出迟到或早退判定。
    evidence:
      quote: "三种规则类型的统计口径不同：自由上下班不得产出迟到/早退判定，只统计旷工。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 可测试的关键判定点
    methods:
      applicable: [逆向场景法, 场景法]
      skipped:
        - method: 边界值法
          reason: 判定输出是「有无迟到早退」的二值结果，无数值边界
        - method: 等价类划分
          reason: 输入已固定为同一批记录，两种类型各一条，分类不增加覆盖
        - method: 错误推测法
          reason: 口径变化已由文档禁止项界定，无需推测改名后的残留判定
        - method: 穷举法
          reason: 只需对比改型前后两份结果，逐项穷举记录无增量结论
        - method: 因果图法
          reason: 单一变量（规则类型）改变单一结果，无组合条件
        - method: 异常法
          reason: 本断言不注入异常打卡数据，只比对同一批记录的结果变化
        - method: 并发法
          reason: 改型是配置动作，判定不依赖并发读写
        - method: 安全性法
          reason: 只比对同一批记录改型前后的结果，不涉及凭证校验或越权访问

  - id: TP-FP-02-01-01
    scenario_id: SC-FP-02-01
    statement: 规则同时选到部门与具体成员时，集合内成员按该规则参与打卡，同部门但不在集合内的成员不受该规则约束。
    evidence:
      quote: "打卡人员是「适用于该条打卡规则的部门和成员」的集合，既可以选到部门，也可以选到具体成员。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡人员
    methods:
      applicable: [等价类划分, 场景法, 因果图法]
      skipped:
        - method: 边界值法
          reason: 人员集合是离散名单，不存在数值临界点
        - method: 错误推测法
          reason: 集合构成由原文界定，无需猜测部门与成员的优先级
        - method: 穷举法
          reason: 成员规模随组织变化无法穷举，按集合内/集合外两类等价类覆盖
        - method: 逆向场景法
          reason: 本条验集合边界，绕过集合的路径由白名单场景覆盖
        - method: 异常法
          reason: 该断言不注入异常人员数据，只验人员集合归属是否正确
        - method: 并发法
          reason: 人员名单为配置读取，不涉及多人同时写同一份数据，无竞态可构造
        - method: 安全性法
          reason: 人员范围是考勤配置，不是访问控制

  - id: TP-FP-02-01-02
    scenario_id: SC-FP-02-01
    statement: 规则只选到具体成员而未选中其所属部门时，该部门其余成员不进入本规则的打卡人员集合。
    evidence:
      quote: "打卡人员是「适用于该条打卡规则的部门和成员」的集合，既可以选到部门，也可以选到具体成员。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡人员
    methods:
      applicable: [等价类划分, 逆向场景法]
      skipped:
        - method: 边界值法
          reason: 选人粒度只有部门与成员两种，没有可取的数值边界
        - method: 错误推测法
          reason: 两种选人方式在原文中并列，无需猜测隐含的部门级联
        - method: 穷举法
          reason: 部门人数不定，穷举成员无意义，按选中/未选中两类覆盖
        - method: 因果图法
          reason: 选人方式与生效范围一对一，无多条件组合
        - method: 场景法
          reason: 该断言可直接读人员集合判定，不需要串联业务流程
        - method: 异常法
          reason: 断言不涉及异常输入，只核对集合成员
        - method: 并发法
          reason: 打卡人员集合是静态配置，读取期间无并发写入，不产生竞态
        - method: 安全性法
          reason: 该断言只核对集合成员，不涉及鉴权、敏感数据或越权访问

  - id: TP-FP-02-02-01
    scenario_id: SC-FP-02-02
    statement: 白名单内的员工当日无打卡记录时，不出现在待打卡名单与异常名单中。
    evidence:
      quote: "白名单内的员工不参与打卡，且不得出现在待打卡/异常名单中。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 可测试的关键判定点
    methods:
      applicable: [逆向场景法, 场景法, 等价类划分]
      skipped:
        - method: 边界值法
          reason: 名单呈现是名单包含与否的离散判定，无数值阈值
        - method: 错误推测法
          reason: 原文已明确不得出现在名单中，无需推测其他豁免入口
        - method: 穷举法
          reason: 白名单人数可变，按名单内/名单外两类等价类覆盖即可
        - method: 因果图法
          reason: 白名单成员身份单条件决定名单呈现
        - method: 异常法
          reason: 本断言只验无打卡记录时的名单，不注入异常打卡数据
        - method: 并发法
          reason: 名单为一次读取的快照，无共享写状态
        - method: 安全性法
          reason: 该断言只读本人名单呈现结果，不涉及越权读取他人考勤数据

  - id: TP-FP-02-02-02
    scenario_id: SC-FP-02-02
    statement: 被加入规则白名单的领导或特殊员工不再被要求完成该规则的上下班打卡。
    evidence:
      quote: "另有例外通道：领导或特殊员工可通过配置白名单，不参与打卡。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡人员
    methods:
      applicable: [场景法, 等价类划分]
      skipped:
        - method: 边界值法
          reason: 是否参与打卡是二值状态，不存在数值临界点
        - method: 错误推测法
          reason: 例外通道的适用对象原文已点明，无需猜测额外豁免人群
        - method: 穷举法
          reason: 账号类型有限且按名单内/外两类划分已足够
        - method: 逆向场景法
          reason: 本条验豁免的正向效果，非名单成员的对照由同场景另一断言验
        - method: 因果图法
          reason: 白名单身份单条件决定是否要求打卡
        - method: 异常法
          reason: 该断言不注入异常打卡数据，只验白名单豁免状态是否生效
        - method: 并发法
          reason: 白名单是静态配置，判定期间无并发写入，构造并发无观测差异
        - method: 安全性法
          reason: 白名单是考勤范围配置，不赋予后台权限

  - id: TP-FP-02-03-01
    scenario_id: SC-FP-02-03
    statement: 同一员工在 A 规则白名单内、同时属于 B 规则打卡人员时，A 规则的豁免不解除其在 B 规则的打卡要求。
    evidence:
      quote: "白名单是规则级的豁免，而非全局的权限开关。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡人员
    methods:
      applicable: [逆向场景法, 安全性法, 场景法]
      skipped:
        - method: 边界值法
          reason: 豁免范围是名单边界而非数值边界，无可取临界值
        - method: 等价类划分
          reason: 断言只有「在 A 名单且在 B 人员」一种组合，再分类不产生新用例
        - method: 错误推测法
          reason: 原文已把规则级与全局级的区别写死，无需猜测例外
        - method: 穷举法
          reason: 规则组合随企业配置增长，不可穷举，按单规则/跨规则两类覆盖
        - method: 因果图法
          reason: 每条规则的豁免各自独立，不存在条件共享
        - method: 异常法
          reason: 本断言不注入异常打卡，只验跨规则的豁免边界
        - method: 并发法
          reason: 两条规则的名单读取互不写入，无竞态

  - id: TP-FP-02-03-02
    scenario_id: SC-FP-02-03
    statement: 员工未被加入任何白名单时，仍需按所属规则完成打卡，不能因同部门存在白名单员工而获得豁免。
    evidence:
      quote: "另有例外通道：领导或特殊员工可通过配置白名单，不参与打卡。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡人员
    methods:
      applicable: [等价类划分, 逆向场景法]
      skipped:
        - method: 边界值法
          reason: 豁免与否是名单成员与否的二值状态，不存在可取的数值临界点
        - method: 错误推测法
          reason: 例外通道的对象已由原文限定，无需断言未列举人群的特殊处理
        - method: 穷举法
          reason: 员工名单可变，按名单内/外两类等价类覆盖已足够
        - method: 因果图法
          reason: 是否在名单内是唯一条件，一对一决定豁免结果，没有与/或组合
        - method: 场景法
          reason: 该断言可直接读打卡要求判定，无需端到端串联
        - method: 异常法
          reason: 不涉及异常入参，只验豁免是否误扩散
        - method: 并发法
          reason: 名单读取为静态快照，无共享写状态
        - method: 安全性法
          reason: 豁免扩散属于范围校验，不构成越权访问

  - id: TP-FP-03-01-01
    scenario_id: SC-FP-03-01
    statement: 员工手机定位落在有效范围内但未连办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
    evidence:
      quote: "手机打卡——系统确认打卡人位置，或判断打卡人是否连上办公地点的 WIFI，满足其中任意一项即可打卡。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 打卡地点与打卡范围
    methods:
      applicable: [因果图法, 等价类划分, 场景法]
      skipped:
        - method: 边界值法
          reason: 本断言固定定位在有效范围内侧，边界距离由打卡范围场景单独验
        - method: 错误推测法
          reason: 「或」关系由原文写明，无需猜测两依据的优先级
        - method: 穷举法
          reason: 两依据的取值组合仅四种，等价类已全部覆盖
        - method: 逆向场景法
          reason: 本条验放行路径，两依据都不满足的被拒路径由相邻断言承担
        - method: 异常法
          reason: 不引入异常入参，只验单依据满足的正常路径
        - method: 并发法
          reason: 单次打卡写入一条记录，无共享可变状态
        - method: 安全性法
          reason: 定位是业务校验，不涉及凭证伪造与鉴权

  - id: TP-FP-03-01-02
    scenario_id: SC-FP-03-01
    statement: 员工未进入定位有效范围但连上办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
    evidence:
      quote: "手机打卡的两条依据（定位、办公 WIFI）为「或」关系，任一满足即应放行；智能考勤机方式下其他设备打卡应被拒绝。"
      path: wiki/attendance-management/attendance-rule-configuration.md
      section: 可测试的关键判定点
    methods:
      applicable: [因果图法, 场景法]
