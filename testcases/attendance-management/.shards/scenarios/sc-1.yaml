meta:
  topic: attendance-management
  title: 打卡管理
  stage: scenarios

scenarios:
  - id: SC-FP-09-01
    fp_id: FP-09
    name: "未强制拍照时的无照片打卡"
    description: "在打卡规则未勾选「员工打卡必须拍照」、员工提交的打卡不带照片的条件下，验该次打卡的受理结论与当日考勤记录内容。"
    basis: "「拍照打卡」与「可测试的关键判定点」第一条（未勾选时无照片打卡应能通过）"
    focus: [正向, 数据准确性]
  - id: SC-FP-09-02
    fp_id: FP-09
    name: "强制拍照下的缺照片打卡"
    description: "在打卡规则勾选「员工打卡必须拍照」、打卡请求不携带照片的条件下，验该次打卡是否被拒绝以及当日该时段的状态。"
    basis: "「拍照打卡」（可要求打卡时必须拍照）与「可测试的关键判定点」第一条（勾选后缺照片必须被拒绝）"
    focus: [异常, 边界]
  - id: SC-FP-09-03
    fp_id: FP-09
    name: "异常备注图片来源限制"
    description: "在勾选「备注不允许上传本地图片，只能拍照」的规则下，分别以本地相册图片和现场拍摄作为异常打卡备注图片来源，验备注提交的受理结论。"
    basis: "「拍照打卡」配套强约束与「可测试的关键判定点」第二条"
    focus: [异常, 安全]
  - id: SC-FP-10-01
    fp_id: FP-10
    name: "补卡审批通过后的状态校正"
    description: "在补卡开关已开启、员工对迟到或早退异常提交补卡申请且上级审批通过的条件下，验打卡状态的最终取值与校准结果的展示位置。"
    basis: "「补卡申请」两条联动结果与「可测试的关键判定点」第四条"
    focus: [正向, 数据准确性]
  - id: SC-FP-10-02
    fp_id: FP-10
    name: "补卡审批未通过时的状态保持"
    description: "在补卡申请已提交但审批未通过、或仍在流转中的条件下，验原异常打卡状态是否保持不变。"
    basis: "「可测试的关键判定点」第三条（审批未通过时打卡状态不得变化）"
    focus: [异常, 数据一致性]
  - id: SC-FP-10-03
    fp_id: FP-10
    name: "补卡开关关闭时的入口与审批前置"
    description: "在打卡规则未勾选补卡申请开关的条件下，验【审批】应用中是否存在补卡申请入口，以及是否存在绕过上级审批直接改变打卡状态的路径。"
    basis: "「补卡申请」两条联动结果与「不存在跳过审批环节的路径」"
    focus: [权限, 异常]
  - id: SC-FP-11-01
    fp_id: FP-11
    name: "不用打卡日期的异常判定"
    description: "在某日期被设置为「不用打卡」且员工当日没有任何打卡记录的条件下，验该日是否产生考勤异常。"
    basis: "「可测试的关键判定点」第五条（不用打卡后该日不产生异常）"
    focus: [正向, 数据准确性]
  - id: SC-FP-11-02
    fp_id: FP-11
    name: "必须打卡日期的缺卡判定"
    description: "在某日期被设置为必须打卡、且员工在该日配置时段内没有打卡记录的条件下，验该日是否被判定为缺卡异常。"
    basis: "「特殊日期打卡」与「可测试的关键判定点」第五条（必须打卡后缺卡应判定为异常）"
    focus: [异常, 数据准确性]
  - id: SC-FP-11-03
    fp_id: FP-11
    name: "同一日期多时段与打卡事由"
    description: "在同一日期配置两个打卡时段并分别填写打卡事由的条件下，验各时段的生效范围与缺卡判定是否逐时段独立成立。"
    basis: "「特殊日期打卡」（同一日期如需多个时间，可新增时段）"
    focus: [正向, 边界]
  - id: SC-FP-12-01
    fp_id: FP-12
    name: "开启后非工作日签到的记录"
    description: "在「非工作日允许打卡」开启、员工于非工作日自由签到的条件下，验工作时长的记录结果与异常判定结果。"
    basis: "「特殊日期打卡」（另一条独立开关是「非工作日允许打卡」）与「可测试的关键判定点」第六条"
    focus: [正向, 数据准确性]
  - id: SC-FP-12-02
    fp_id: FP-12
    name: "关闭时非工作日打卡的受理结论"
    description: "在「非工作日允许打卡」关闭、员工于非工作日发起打卡的条件下，验系统对本次打卡的受理结论与是否计入考勤统计。"
    basis: "「可测试的关键判定点」第六条（关闭时非工作日打卡应被拒绝或不计入）"
    focus: [异常]
  - id: SC-FP-13-01
    fp_id: FP-13
    name: "提醒时间配置后的提醒送达"
    description: "在打卡规则的提醒下拉列表已选定提醒时间、员工在指定时间前尚未打卡的条件下，验提醒消息的送达时点与接收对象。"
    basis: "「打卡提醒」（下拉列表选择提醒时间、届时企业微信收到提醒）"
    focus: [正向]
  - id: SC-FP-13-02
    fp_id: FP-13
    name: "准点与提前两类提醒时点"
    description: "在提醒取值分别为准点提醒与提前提醒的条件下，验两类提醒的触达时点与打卡时间的先后关系。"
    basis: "「打卡提醒」（打卡时间准点或提前提醒）"
    focus: [边界, 数据准确性]
  - id: SC-FP-14-01
    fp_id: FP-14
    name: "默认所有人可见"
    description: "在打卡应用未做过可见范围配置的条件下，验通讯录内成员在手机端能否看到并使用打卡应用入口。"
    basis: "「打卡应用的可见范围」（系统默认打卡应用为所有人可见）"
    focus: [正向]
  - id: SC-FP-14-02
    fp_id: FP-14
    name: "范围外成员的应用入口可见性"
    description: "在可见范围被配置为指定部门与成员、某员工不在该范围内的条件下，验该员工手机端打卡应用入口的可见性。"
    basis: "「可测试的关键判定点」第八条（范围外成员不应再看到打卡应用入口）"
    focus: [权限, 异常]
  - id: SC-FP-14-03
    fp_id: FP-14
    name: "部门与成员两类配置对象"
    description: "在分别按整个部门和按单个成员配置可见范围的条件下，验两类配置对象覆盖的成员能否都看到打卡应用入口。"
    basis: "「打卡应用的可见范围」（从通讯录列表中选择部门和成员即可配置）"
    focus: [正向, 数据一致性]
  - id: SC-FP-15-01
    fp_id: FP-15
    name: "早退时长与事假时段匹配后的校准"
    description: "在员工上班早退 2 小时、且存在同一时间段 2 小时已通过事假的条件下，验该员工的打卡状态取值。"
    basis: "「打卡与审批的关联」校准示例表第一行与「匹配即校准」"
    focus: [正向, 数据准确性]
  - id: SC-FP-15-02
    fp_id: FP-15
    name: "非工作日加班卡与加班申请匹配后的校准"
    description: "在员工非工作日打了 10 小时加班卡、且当日存在已通过加班申请的条件下，验校准后该日状态的取值。"
    basis: "「打卡与审批的关联」校准示例表第二行"
    focus: [正向, 数据准确性]
  - id: SC-FP-15-03
    fp_id: FP-15
    name: "未匹配或超出覆盖时段的异常保持"
    description: "在异常时段与任何已通过审批的时间段都不重叠、或该员工根本不存在对应审批的条件下，验异常状态是否保持原样。"
    basis: "「两个例子共同的前提」与「可测试的关键判定点」第七条（审批覆盖时段之外的异常不得被一并校准）"
    focus: [异常, 边界]
