meta:
  topic: attendance-management
  title: 打卡管理
  stage: scenarios

scenarios:
  - id: SC-FP-01-01
    fp_id: FP-01
    name: 三类规则的统计口径并存
    description: 同一企业下同时存在固定时间、按班次、自由上下班三条规则且各绑定了对应人员时，验三条规则各自产出的考勤判定口径。
    basis: 文档「三种规则类型」表格对三类口径与统计特性的定义
    focus: [正向, 数据准确性]

  - id: SC-FP-01-02
    fp_id: FP-01
    name: 自由上下班规则下的迟到早退判定
    description: 员工所在规则为自由上下班、当日有或没有打卡记录时，验系统是否仍产出迟到或早退结论。
    basis: 文档「可测试的关键判定点」第一条对自由上下班的限制
    focus: [异常, 数据准确性]

  - id: SC-FP-01-03
    fp_id: FP-01
    name: 按工作性质分派后的口径隔离
    description: 设备运维部门套按班次上下班、销售部套自由上下班之后，验两个部门的考勤判定口径是否互不串用。
    basis: 文档「打卡人员」段落给出的按工作性质分派典型组合
    focus: [正向, 数据一致性]

  - id: SC-FP-02-01
    fp_id: FP-02
    name: 部门与成员混合划定的适用范围
    description: 规则以部门加具体成员的混合方式划定打卡人员时，验集合内成员受约束、集合外成员不受约束的边界。
    basis: 文档「打卡人员」段落对集合构成的说明
    focus: [正向, 数据准确性]

  - id: SC-FP-02-02
    fp_id: FP-02
    name: 白名单员工的打卡名单呈现
    description: 员工处于规则白名单内且当日无打卡记录时，验其在待打卡名单与异常名单中的呈现。
    basis: 文档「可测试的关键判定点」第二条对白名单员工的要求
    focus: [异常, 数据准确性]

  - id: SC-FP-02-03
    fp_id: FP-02
    name: 白名单豁免的作用范围
    description: 同一员工在 A 规则白名单内、同时又属于 B 规则打卡人员时，验豁免是否只作用于 A 规则。
    basis: 文档「打卡人员」段落对白名单是规则级豁免的定性
    focus: [权限, 数据一致性]

  - id: SC-FP-03-01
    fp_id: FP-03
    name: 手机打卡凭证满足其一即产生记录
    description: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
    basis: 文档「三种打卡方式」表格手机打卡行与「打卡地点与打卡范围」第一条
    focus: [正向, 集成]

  - id: SC-FP-03-02
    fp_id: FP-03
    name: 智能考勤机的指定设备打卡
    description: 规则按设备名称选定智能考勤机后，验规则内人员在指定设备与非指定设备上打卡的记录归属差异。
    basis: 文档对智能考勤机方式只能指定设备打卡的约束
    focus: [异常, 数据准确性]

  - id: SC-FP-03-03
    fp_id: FP-03
    name: U盘导入的离线采集与批量核算
    description: 仍使用传统U盘考勤机的企业先导出通讯录、再定期把打卡记录导回时，验系统按所设规则核算这批记录的情况。
    basis: 文档对 U盘导入是先离线采集后批量导入唯一路径的说明
    focus: [正向, 集成]

  - id: SC-FP-04-01
    fp_id: FP-04
    name: 打卡范围 100 至 300 米的边界
    description: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界时，验有效范围的生效情况。
    basis: 文档「打卡地点与打卡范围」对 100 至 300 米有效范围的说明与关键判定点第四条
    focus: [边界, 数据准确性]

  - id: SC-FP-04-02
    fp_id: FP-04
    name: 智能考勤机的设备与人数上限
    description: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用时，验设备约束的生效情况。
    basis: 文档「打卡地点与打卡范围」末段的容量约束与关键判定点第五条
    focus: [异常, 边界]

  - id: SC-FP-04-03
    fp_id: FP-04
    name: Wi-Fi 凭证的获取与校验
    description: 通过 IT 管理员询问或扫描二维码取得 Wi-Fi 的 MAC 地址/bssid 并录入规则后，验员工连上该 Wi-Fi 时的打卡放行。
    basis: 文档「打卡地点与打卡范围」对 WIFI 打卡凭证的要求
    focus: [正向, 可用性]

  - id: SC-FP-05-01
    fp_id: FP-05
    name: 迟到容差阈值的触发点
    description: 规则设定允许迟到 N 分钟后，员工在应上班时间之后第 N 分钟与第 N+1 分钟打卡时，验迟到判定的触发点。
    basis: 文档「上下班时间与容差」对容差阈值决定迟到/早退判定触发点的说明
    focus: [边界, 异常]

  - id: SC-FP-05-02
    fp_id: FP-05
    name: 早退容差阈值的触发点
    description: 规则设定允许早退 N 分钟后，员工在应下班时间之前第 N 分钟与第 N+1 分钟打卡时，验早退判定的触发点。
    basis: 文档在高级设置中把迟到与早退分钟数并列设定
    focus: [正向, 边界]

  - id: SC-FP-06-01
    fp_id: FP-06
    name: 外出打卡的定位与拍照依据
    description: 出差外勤成员无法在办公区域打卡时，在手机客户端上传位置定位并拍照，验该次外出打卡是否成立。
    basis: 文档「外出打卡」段落对打卡依据的说明
    focus: [正向, 数据准确性]

  - id: SC-FP-06-02
    fp_id: FP-06
    name: 启用只能拍照后的相册路径
    description: 规则启用照片来源限制后，外出人员分别从相册选取图片与现场拍照提交，验相册路径的可提交性。
    basis: 文档「外出打卡」段落与「可测试的关键判定点」第六条
    focus: [安全, 异常]
