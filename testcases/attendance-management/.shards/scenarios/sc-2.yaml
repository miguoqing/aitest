meta:
  topic: attendance-management
  title: 打卡管理
  stage: scenarios

scenarios:
  - id: SC-FP-17-01
    fp_id: FP-17
    name: 超级管理员的规则设置覆盖全员
    description: 账号为超级管理员且企业内存在多个部门与员工时，验证规则设置范围与统计查看范围是否以全员为界
    basis: 文档「两类管理员」表格中超级管理员一行的设置范围与查看范围
    focus: [正向, 权限]

  - id: SC-FP-17-02
    fp_id: FP-17
    name: 分级管理员的规则设置限于管辖范围
    description: 账号为分级管理员且已分配管辖范围时，验证规则设置与统计查看是否只落在管辖范围内
    basis: 文档「两类管理员」表格中分级管理员一行的设置范围与查看范围
    focus: [正向, 权限]

  - id: SC-FP-17-03
    fp_id: FP-17
    name: 分级管理员面对范围外员工的范围划界
    description: 分级管理员的管辖范围外还存在其他部门与员工时，验证范围划界是否把这些对象排除在操作对象之外
    basis: 文档「可测试的关键判定点」中分级管理员只能操作管辖范围的规定
    focus: [负向, 权限]

  - id: SC-FP-18-01
    fp_id: FP-18
    name: 超级管理员分配权限后分级管理员获得对应范围
    description: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
    basis: 文档「两类管理员」中超级管理员承担权限分配职责与管理员配置入口
    focus: [正向, 权限]

  - id: SC-FP-18-02
    fp_id: FP-18
    name: 非超级管理员发起权限分配
    description: 操作账号为分级管理员或普通成员时，验证权限分配职责是否被限制在超级管理员一侧
    basis: 文档「两类管理员」中超级管理员可对所有管理员的权限进行分配
    focus: [负向, 权限]

  - id: SC-FP-19-01
    fp_id: FP-19
    name: 管理后台侧设置规则后的生效结果
    description: 超级管理员在管理后台侧完成规则设置、移动端未改动时，验证全员在打卡与统计上按该规则产出
    basis: 文档「可测试的关键判定点」中规则设置需在管理后台与移动端两侧均可生效
    focus: [正向, 数据一致性]

  - id: SC-FP-19-02
    fp_id: FP-19
    name: 移动端侧设置规则后的生效结果
    description: 超级管理员在移动端侧完成同一项规则设置、管理后台未改动时，验证两端指向同一份规则内容
    basis: 文档「可测试的关键判定点」中规则设置需在管理后台与移动端两侧均可生效
    focus: [正向, 数据一致性]

  - id: SC-FP-19-03
    fp_id: FP-19
    name: 两端规则状态不一致
    description: 同一规则在管理后台与移动端分别查看或分别修改后，验证两端呈现的规则内容与打卡判定是否仍为同一份
    basis: 文档「可测试的关键判定点」中两侧均可生效所含的双端一致要求
    focus: [异常, 数据一致性]

  - id: SC-FP-20-01
    fp_id: FP-20
    name: 分级管理员在管辖范围内的可见与可操作
    description: 分级管理员的管辖范围已分配、范围外另有其他部门与员工时，验证范围内规则与统计的可见性与可操作性
    basis: 文档「可测试的关键判定点」中分级管理员只能操作管辖范围内的规则与统计
    focus: [正向, 权限]

  - id: SC-FP-20-02
    fp_id: FP-20
    name: 范围外对象的可见性
    description: 分级管理员的管辖范围外存在其他部门与员工时，验证这些对象在其视图与列表中的暴露情况
    basis: 文档「可测试的关键判定点」中范围外的部门/员工必须不可见
    focus: [负向, 权限]

  - id: SC-FP-20-03
    fp_id: FP-20
    name: 绕过界面直接触达范围外对象
    description: 分级管理员身份下的数据请求不经界面入口、指向范围外的规则与统计数据时，验证服务端的拦截
    basis: 文档「可测试的关键判定点」中范围外的部门/员工必须不可见或不可操作
    focus: [逆向, 安全]

  - id: SC-FP-21-01
    fp_id: FP-21
    name: 单一筛选条件的结果
    description: 打卡记录同时存在多个部门、多名人员与多种打卡状态时，验证按时间、部门、打卡人员、打卡状态中任一单条件筛选后的结果集合
    basis: 文档「查看与导出打卡记录」中顶部工具栏可按时间、部门、打卡人员、打卡状态筛选
    focus: [正向, 数据准确性]

  - id: SC-FP-21-02
    fp_id: FP-21
    name: 多条件组合的交集
    description: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
    basis: 文档「可测试的关键判定点」中筛选条件组合使用时结果应取交集
    focus: [正向, 数据准确性]

  - id: SC-FP-21-03
    fp_id: FP-21
    name: 无匹配结果与极端条件组合
    description: 筛选条件组合在数据集中不存在任何匹配记录、或某维度取空值时，验证结果集与界面呈现
    basis: 文档「可测试的关键判定点」中交集规则在无匹配数据时的边界取值
    focus: [边界, 异常]

  - id: SC-FP-22-01
    fp_id: FP-22
    name: 按日统计 Tab 的导出内容
    description: 「按日统计」Tab 处于某一组筛选条件下时，验证导出 Excel 的记录范围与统计口径
    basis: 文档「查看与导出打卡记录」中导出条目与两份导出数据须与对应 Tab 一致
    focus: [正向, 导出]

  - id: SC-FP-22-02
    fp_id: FP-22
    name: 按月统计 Tab 的导出内容
    description: 「按月统计」Tab 处于某一组筛选条件下时，验证导出 Excel 的月度汇总口径与记录范围
    basis: 文档「可测试的关键判定点」中按日与按月两份导出数据须分别与对应 Tab 一致
    focus: [正向, 导出]

  - id: SC-FP-22-03
    fp_id: FP-22
    name: 筛选条件变更后的重复导出
    description: 同一组筛选条件下的导出与变更条件后的导出两个时点，验证导出内容与各自筛选条件的对应关系
    basis: 文档「可测试的关键判定点」中导出数据须与对应 Tab 及筛选条件一致
    focus: [边界, 数据一致性]

  - id: SC-FP-23-01
    fp_id: FP-23
    name: API 导出与后台导出的口径比对
    description: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
    basis: 文档「可测试的关键判定点」中 API 导出数据应与后台导出在相同时间范围下口径一致
    focus: [正向, 数据一致性]

  - id: SC-FP-23-02
    fp_id: FP-23
    name: 无权限身份调用导出接口
    description: 调用方为非管理员或未获授权的应用时，验证接口对调用方身份的访问控制
    basis: 文档「API 导出数据」中管理员可通过接口调用导出打卡数据
    focus: [负向, 安全]

  - id: SC-FP-23-03
    fp_id: FP-23
    name: 空时间范围与无数据区间的接口返回
    description: 请求的时间范围内不存在任何打卡记录时，验证接口返回结构与非空字段的表达方式
    basis: 文档「可测试的关键判定点」中同口径一致条款在无数据区间上的边界取值
    focus: [边界, 数据准确性]

  - id: SC-FP-24-01
    fp_id: FP-24
    name: 未分配管辖范围的新增分级管理员
    description: 新增分级管理员时管辖范围为空、尚未分配任何部门，验证其规则修改权限的有无
    basis: 文档「可测试的关键判定点」中未分配管辖范围时不应具备任何规则修改权限
    focus: [边界, 权限]

  - id: SC-FP-24-02
    fp_id: FP-24
    name: 补充分配管辖范围后获得范围内权限
    description: 分级管理员的管辖范围已完成补充分配、范围外另有其他部门时，验证其获得范围内规则修改权限的条件
    basis: 文档「可测试的关键判定点」中范围内规则可操作的规定，与未分配范围的边界形成对照
    focus: [正向, 权限]
