cases:
- id: TC-ATT-1801
  fp_id: FP-18
  scenario_id: SC-FP-18-01
  point_id: TP-FP-18-01-01
  functional_point: 管理员配置与权限分配
  scenario: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
  test_point: 超级管理员经权限管理入口添加系统管理员并填写管理员信息后，被添加者获得其管辖范围内的管理能力。
  title: 按文档入口完整添加一名分级管理员并核对其能力
  design_method: 场景法
  tags:
  - 正向
  - 权限
  severity: S2
  severity_reason: 添加管理员的配置链路一旦不通，管理员无法被授权，后续规则设置与统计核对都没有人能承担
  preconditions: 存在超级管理员账号；企业通讯录中有「测试部」及成员张三；张三当前不是任何类型管理员；添加时把张三的管辖范围设为测试部
  steps:
  - 用超级管理员账号登录【管理后台】
  - 依次进入【我的企业】>【权限管理】>【添加系统管理员】
  - 在【设置管理员信息】中填写张三的管理员信息并保存
  - 用张三账号登录【管理后台】，打开打卡规则列表
  expected:
  - 步骤 2 的路径逐级可达，【设置管理员信息】页可填写并保存成功
  - 保存后张三出现在权限管理页的管理员列表中
  - 张三登录后可打开测试部规则的修改入口
  status: active
  source_context:
    quote: 管理员配置入口：【管理后台】>【我的企业】>【权限管理】>【添加系统管理员】>【设置管理员信息】。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
- id: TC-ATT-1802
  fp_id: FP-18
  scenario_id: SC-FP-18-01
  point_id: TP-FP-18-01-01
  functional_point: 管理员配置与权限分配
  scenario: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
  test_point: 超级管理员经权限管理入口添加系统管理员并填写管理员信息后，被添加者获得其管辖范围内的管理能力。
  title: 添加管理员后核对被授权账号与管理员列表
  design_method: 安全性法
  tags:
  - 安全
  - 权限
  severity: S1
  severity_reason: 权限被授予错误对象等于为他人开出管理员身份，可直接修改全员打卡规则并影响全部考勤结论
  preconditions: 超级管理员账号 A 可用；通讯录中有成员张三、李四；两人当前均不是管理员
  steps:
  - 用 A 登录【管理后台】并进入【我的企业】>【权限管理】>【添加系统管理员】
  - 在【设置管理员信息】中填写张三的管理员信息并保存
  - 用李四账号登录【管理后台】，打开打卡规则列表
  - 用 A 账号重新打开权限管理页的管理员列表
  expected:
  - 管理员列表中只有张三，李四不在管理员列表中
  - 李四登录后打卡规则列表中没有可用的规则修改入口
  - A 的管理员身份与可操作项在添加前后一致
  status: active
  source_context:
    quote: 管理员配置入口：【管理后台】>【我的企业】>【权限管理】>【添加系统管理员】>【设置管理员信息】。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
