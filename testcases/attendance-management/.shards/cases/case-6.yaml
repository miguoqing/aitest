  fp_id: FP-18
  scenario_id: SC-FP-18-02
  point_id: TP-FP-18-02-01
  functional_point: 管理员配置与权限分配
  scenario: 操作账号为分级管理员或普通成员时，验证权限分配职责是否被限制在超级管理员一侧
  test_point: 非超级管理员账号无法对管理员权限进行分配，权限管理入口对其不可达。
  title: 以分级管理员身份打开权限管理页查看管理员分配入口
  design_method: 逆向场景法
