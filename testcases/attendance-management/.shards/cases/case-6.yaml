- id: TC-ATT-1808
  fp_id: FP-18
  scenario_id: SC-FP-18-02
  point_id: TP-FP-18-02-01
  functional_point: 管理员配置与权限分配
  scenario: 操作账号为分级管理员或普通成员时，验证权限分配职责是否被限制在超级管理员一侧
  test_point: 非超级管理员账号无法对管理员权限进行分配，权限管理入口对其不可达。
  title: 以分级管理员身份直接调用添加系统管理员的请求
  design_method: 安全性法
  tags:
  - 安全
  - 权限
  severity: S1
  severity_reason: 服务端不校验发起方身份时，任一管理员可自行提权或为他人授权，直接突破「各司其职」的权限边界
  preconditions: 已取得添加系统管理员的请求参数样例；操作会话为一名分级管理员；目标成员赵六当前不是管理员
  steps:
  - 用分级管理员账号登录并取得其会话凭证
  - 以该凭证向添加系统管理员接口提交把赵六设为管理员的请求
  - 用超级管理员账号打开【权限管理】页的管理员列表核对
  expected:
  - 该请求返回拒绝，不返回成功结果
  - 管理员列表中不出现赵六，赵六登录后没有任何管理员操作入口
  status: active
  source_context:
    quote: 超级管理员还承担权限分配职责：可对所有管理员的权限进行分配，保证各司其职。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
- id: TC-ATT-1809
  fp_id: FP-18
  scenario_id: SC-FP-18-02
  point_id: TP-FP-18-02-01
  functional_point: 管理员配置与权限分配
  scenario: 操作账号为分级管理员或普通成员时，验证权限分配职责是否被限制在超级管理员一侧
  test_point: 非超级管理员账号无法对管理员权限进行分配，权限管理入口对其不可达。
  title: 权限分配的保存请求被中断后重试
  design_method: 异常法
  tags:
  - 异常
  - 权限
  - 数据一致性
  severity: S2
  severity_reason: 权限保存半写入会让管理员实际权限与界面回显不一致，越权与漏权都难以定位
  preconditions: 超级管理员账号可用；管理员列表中有一名分级管理员王五，其管辖范围为测试部且已记录；可模拟网络中断
  steps:
  - 用超级管理员账号进入王五的权限设置页并改动管辖范围
  - 在点击保存的同一时刻断开网络，使保存请求失败
  - 恢复网络后重新打开管理员列表与王五的权限设置页
  expected:
  - 王五的管辖范围与改动前完全一致，不出现只保存了一部分的中间状态
  - 重新保存一次后管辖范围才变为改动后的内容
  status: active
  source_context:
    quote: 超级管理员还承担权限分配职责：可对所有管理员的权限进行分配，保证各司其职。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
- id: TC-ATT-1901
  fp_id: FP-19
  scenario_id: SC-FP-19-01
  point_id: TP-FP-19-01-01
  functional_point: 超级管理员规则的双端生效
  scenario: 超级管理员在管理后台侧完成规则设置、移动端未改动时，验证全员在打卡与统计上按该规则产出
  test_point: 超级管理员在管理后台侧设置规则后，全员当日打卡与统计按新规则产出，不残留旧规则结果。
  title: 管理后台设置上下班时间后核对员工当日考勤判定
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 后台设置的规则若未进入判定，管理员所见的规则与全员当日考勤结论不一致，迟到早退全部失真
  preconditions: 超级管理员账号可用；测试部成员张三；该规则的允许迟到、早退分钟数均配置为 0；当日为工作日；移动端未改动任何规则
  steps:
  - 用超级管理员账号登录【管理后台】，把测试部所用规则的工作时间设为 09:00-18:00 并保存
  - 不修改移动端的任何配置
  - 张三在 09:30 与 18:10 各完成一次手机打卡
  - 在【打卡记录】中打开张三当日明细
  expected:
  - 张三当日明细按 09:00-18:00 判定：09:30 的上班打卡计入迟到，18:10 的下班打卡不判早退
  - 明细中不出现该规则修改前工作时间产生的迟到、早退结论
  status: active
  source_context:
    quote: 超级管理员的规则设置需在管理后台与移动端两侧均可生效。
