  functional_point: 管理员配置与权限分配
  scenario: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
  test_point: 超级管理员经权限管理入口添加系统管理员并填写管理员信息后，被添加者获得其管辖范围内的管理能力。
