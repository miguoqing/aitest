- id: TC-ATT-1804
  fp_id: FP-18
  scenario_id: SC-FP-18-01
  point_id: TP-FP-18-01-02
  functional_point: 管理员配置与权限分配
  scenario: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
  test_point: 权限分配的发起方限定为超级管理员，且可分配对象覆盖全部管理员。
  title: 分别把两名成员分配为超级管理员与分级管理员
  design_method: 等价类划分
  tags:
  - 正向
  - 权限
  severity: S2
  severity_reason: 两类管理员身份只要有一类无法被分配，权限治理就会出现无法配置的角色，职责无法落地
  preconditions: 超级管理员账号可用；通讯录中有成员甲、乙，当前均不是管理员
  steps:
  - 进入【我的企业】>【权限管理】>【添加系统管理员】，把甲设为超级管理员并保存
  - 在同一入口把乙设为分级管理员、管辖范围划为测试部并保存
  - 打开管理员列表核对甲、乙的管理员类型
  expected:
  - 甲在管理员列表中显示为超级管理员，乙显示为分级管理员
  - 两类身份均保存成功，列表中的管理员信息与本次填写内容一致
  status: active
  source_context:
    quote: 超级管理员还承担权限分配职责：可对所有管理员的权限进行分配，保证各司其职。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
- id: TC-ATT-1805
  fp_id: FP-18
  scenario_id: SC-FP-18-01
  point_id: TP-FP-18-01-02
  functional_point: 管理员配置与权限分配
  scenario: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
  test_point: 权限分配的发起方限定为超级管理员，且可分配对象覆盖全部管理员。
  title: 只改甲一名管理员的管辖范围后核对同部门的乙
  design_method: 安全性法
  tags:
  - 安全
  - 权限
  severity: S2
  severity_reason: 权限分配若按部门批量外溢，一名管理员的调整会顺带扩大他人的规则范围，越权无从追溯
  preconditions: 同一部门「测试部」内有两名分级管理员甲、乙，管辖范围均为测试部；公司另有产品部
  steps:
  - 超级管理员进入【权限管理】，只把甲的管辖范围改为测试部与产品部并保存
  - 打开乙的管理员信息核对管辖范围
  - 用乙账号登录查看其可设置的规则范围
  expected:
  - 乙的管辖范围仍为测试部，未随甲的分配一并变为测试部与产品部
  - 乙登录后可设置的规则范围与修改前一致
  status: active
  source_context:
    quote: 超级管理员还承担权限分配职责：可对所有管理员的权限进行分配，保证各司其职。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
- id: TC-ATT-1806
  fp_id: FP-18
  scenario_id: SC-FP-18-01
  point_id: TP-FP-18-01-02
  functional_point: 管理员配置与权限分配
  scenario: 超级管理员已完成分级管理员添加并填写管理员信息、管辖范围已划定，验证被分配者获得范围内管理能力的条件
  test_point: 权限分配的发起方限定为超级管理员，且可分配对象覆盖全部管理员。
  title: 对管理员列表中的全部三名管理员逐个执行一次权限分配
  design_method: 场景法
  tags:
  - 正向
  - 权限
  severity: S2
  severity_reason: 只要有一类管理员对象无法被分配，权限职责就无法按人收回或扩展，管理员权限长期漂移
  preconditions: 管理员列表中共有 3 名管理员（1 名超级管理员、2 名分级管理员），管辖范围均已划定
  steps:
  - 超级管理员进入【我的企业】>【权限管理】，记录 3 名管理员的管辖范围
  - 依次打开每名管理员的权限设置，各调整一次管辖范围并保存
  - 保存后重新打开管理员列表，核对 3 名的管辖范围
  expected:
  - 3 名管理员逐次保存均成功，无一对象因类型不同被拒绝进入权限设置
  - 列表回显的 3 个管辖范围与各自最后一次保存的内容一致
  status: active
  source_context:
    quote: 超级管理员还承担权限分配职责：可对所有管理员的权限进行分配，保证各司其职。
    path: wiki/attendance-management/permissions-and-export.md
    section: 两类管理员
