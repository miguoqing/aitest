  - 进入【我的企业】，打开【权限管理】页
  - 查看页面中是否存在【添加系统管理员】入口及其可用状态
  expected:
  - 待确认：分级管理员进入【权限管理】时，【添加系统管理员】入口是完全不可见，还是可见但点击后被拒绝并提示无权限？
