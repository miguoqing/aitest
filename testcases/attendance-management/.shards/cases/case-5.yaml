  scenario: 账号为分级管理员且已分配管辖范围时，验证规则设置与统计查看是否只落在管辖范围内
  test_point: 分级管理员的查看统计范围等于其管辖范围，统计结果不含范围外员工的数据。
  title: 穷举分级管理员可用的单条件与组合筛选，核对结果恒为管辖内子集
  design_method: 穷举法
  tags:
  - 数据准确性
  - 权限
  severity: S2
  severity_reason: 某个筛选入口未叠加范围约束时，换一种筛选方式即可看到范围外数据，越权会从最不常走的那条入口漏出去。
  preconditions: 分级管理员管辖研发部；研发部当日有打卡记录与 1 条异常记录；销售部同日也有打卡与异常记录，且在其范围外；筛选条件限于时间、部门、人员、状态四类。
  steps:
  - 依次用「部门=研发部」「人员=研发部某员工」「状态=异常」三个单条件筛选并记录结果人数
  - 再用「部门=研发部」+「状态=异常」两个条件组合筛选
  - 逐次核对每次结果中的人员归属部门
  expected:
  - 「部门=研发部」的结果只含研发部员工
  - 「人员=研发部某员工」的结果只含该员工本人
  - 「状态=异常」的结果只含研发部员工的异常记录
  - 「部门+状态」组合结果等于两个单条件结果的交集，均不含销售部员工
  status: active
  source_context:
    quote: 分级管理员只能操作管辖范围内的规则与统计，范围外的部门/员工必须不可见或不可操作。
