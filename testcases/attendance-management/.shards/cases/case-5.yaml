- id: TC-ATT-1001
  fp_id: FP-10
  scenario_id: SC-FP-10-01
  point_id: TP-FP-10-01-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在补卡开关已开启、员工对迟到或早退异常提交补卡申请且上级审批通过的条件下，验打卡状态的最终取值与校准结果的展示位置。
  test_point: 补卡申请审批通过后，该员工当日被打上异常标记的打卡状态被系统自动校正为正常。
  title: 员工提交补卡申请并由上级审批通过后查看当日打卡状态
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 审批通过后状态未校正会让补卡白做，迟到结论错误地进入考勤汇总与后续薪酬核对，且事后无法从记录中区分是未校准还是校准失败。
  preconditions: 打卡规则已勾选「员工异常打卡时可提交申请，审批通过后修正异常」；员工 A 当日上班迟到形成异常打卡记录；A 的上级 B 已被配置为该单据的审批人。
  steps:
  - 员工 A 在【审批】应用中提交「打卡补卡」申请，选择当日迟到时段
  - 上级 B 在【审批】应用中审批通过该补卡申请
  - 在【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】中打开 A 当日打卡记录
  expected:
  - 审批通过后 A 当日打卡状态由迟到异常变为正常
  - A 当日不再计入迟到异常条数
  status: active
  source_context:
    quote: 审批通过后，系统自动将异常打卡状态校正为正常。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 补卡申请
- id: TC-ATT-1002
  fp_id: FP-10
  scenario_id: SC-FP-10-01
  point_id: TP-FP-10-01-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在补卡开关已开启、员工对迟到或早退异常提交补卡申请且上级审批通过的条件下，验打卡状态的最终取值与校准结果的展示位置。
  test_point: 补卡申请审批通过后，该员工当日被打上异常标记的打卡状态被系统自动校正为正常。
  title: 用迟到与早退两类异常分别走审批通过的组合核对校正结果
  design_method: 因果图法
  tags:
  - 正向
  - 数据一致性
  severity: S2
  severity_reason: 若只对其中一类异常触发校正，另一类员工即使审批通过也无法消除异常，这条申诉通道对该类异常实际不可用。
  preconditions: 补卡开关已开启；员工 A 当日上班迟到、员工 C 当日下班早退，两人均已形成异常记录；A 与 C 的上级 B 为共同审批人。
  steps:
  - 员工 A 就当日迟到异常提交补卡申请
  - 员工 C 就当日早退异常提交补卡申请
  - 上级 B 依次审批通过 A 与 C 的补卡申请
  - 打开 A 与 C 当日打卡记录比对状态
  expected:
  - A（迟到异常 + 审批通过）的打卡状态变为正常
  - C（早退异常 + 审批通过）的打卡状态变为正常
  status: active
  source_context:
    quote: 审批通过后，系统自动将异常打卡状态校正为正常。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 补卡申请
- id: TC-ATT-1003
  fp_id: FP-10
  scenario_id: SC-FP-10-01
  point_id: TP-FP-10-01-02
  functional_point: 补卡申请与审批修正异常
  scenario: 在补卡开关已开启、员工对迟到或早退异常提交补卡申请且上级审批通过的条件下，验打卡状态的最终取值与校准结果的展示位置。
  test_point: 补卡审批通过后的校准结果在【打卡记录】>【校准状态】中可见。
  title: 对比有审批覆盖与无审批覆盖两类异常记录的校准状态取值
  design_method: 等价类划分
  tags:
  - 数据准确性
  severity: S3
  severity_reason: 校准状态取值分不开两类记录时，人事无法判断哪条异常已被审批解释，核对只能回查原始单据，效率损失大但不改变考勤结论。
  preconditions: 补卡开关已开启；员工 A 当日迟到异常已有审批通过的补卡申请；员工 C 当日迟到异常未提交任何申请；两人同属一个部门并适用同一规则。
  steps:
  - 打开【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】的【打卡记录】列表
  - 定位 A 与 C 两条当日异常记录
  - 读取两条记录的「校准状态」列取值
  expected:
  - A 的「校准状态」显示为经补卡审批校准后的正常
  - C 的「校准状态」保持原异常、不显示任何校准来源
  status: active
  source_context:
    quote: 审批通过后异常状态自动转为正常，且校准结果在【打卡记录】>【校准状态】中可见。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 可测试的关键判定点
