  point_id: TP-FP-10-03-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在打卡规则未勾选补卡申请开关的条件下，验【审批】应用中是否存在补卡申请入口，以及是否存在绕过上级审批直接改变打卡状态的路径。
