  test_point: 员工不存在跳过上级审批直接改变异常打卡状态的路径，任何状态变更都以审批通过为前提。
  title: 员工尝试不经审批直接改写自己的异常打卡状态
  design_method: 安全性法
  tags:
  - 安全
  - 权限
  severity: S1
  severity_reason: 若能绕过审批改写打卡状态，任何员工都可自行消除迟到记录，考勤结论失去可信度，审批制度同时被架空。
  preconditions: 补卡开关已关闭；员工 A 当日上班迟到形成异常记录且未提交任何补卡申请；A 仅有员工账号权限。
  steps:
  - 以 A 的账号在打卡记录与打卡应用内查找是否存在直接修改当日打卡状态的入口
  - 用 A 的凭证构造一次把当日状态改为正常的请求并提交
  - 回查 A 当日打卡状态与【审批】中的单据
  expected:
  - 员工端不提供修改打卡状态的入口
  - 直接改状态的请求不成功，A 当日状态仍为迟到异常
  - 该尝试不生成任何补卡审批单据
  status: active
  source_context:
    quote: 补卡申请由员工发起、经上级审批后才能改变打卡状态，不存在跳过审批环节的路径。
