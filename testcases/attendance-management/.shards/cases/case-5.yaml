  - 数据准确性
  severity: S3
  severity_reason: 校准结果不在此处展示时，状态虽已转为正常但无校准痕迹可查，HR 无法向员工解释当天为何不算迟到。
  preconditions: 补卡开关已开启；员工 A 当日上班迟到形成异常；A 已提交当日迟到时段的补卡申请且尚未审批。
  steps:
  - 员工 A 在【审批】应用中提交当日迟到时段的补卡申请
  - 上级 B 在【审批】应用中审批通过该申请
  - 进入【打卡记录】>【校准状态】查看 A 当日记录
  expected:
  - 【打卡记录】>【校准状态】中出现 A 当日这一次校准结果
  - 该校准结果对应的日期为 A 的异常发生日
  status: active
