- id: TC-ATT-1005
  fp_id: FP-10
  scenario_id: SC-FP-10-02
  point_id: TP-FP-10-02-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在补卡申请已提交但审批未通过、或仍在流转中的条件下，验原异常打卡状态是否保持不变。
  test_point: 补卡申请审批未通过时，该员工当日的异常打卡状态保持原值，不出现任何自动校准。
  title: 上级驳回补卡申请后回查该员工当日打卡状态
  design_method: 逆向场景法
  tags:
  - 异常
  - 数据一致性
  severity: S2
  severity_reason: 驳回后状态仍被校正，等于员工绕过审批消除异常，考勤结论与审批结论相互矛盾。
  preconditions: 补卡开关已开启；员工 A 当日下班早退形成异常记录；A 已提交补卡申请并处于待审批状态。
  steps:
  - 上级 B 在【审批】应用中驳回 A 的补卡申请
  - 打开 A 当日打卡记录查看状态与校准状态
  - 打开当日考勤统计核对迟到早退条数
  expected:
  - A 当日打卡状态仍为早退异常，未被校正
  - A 当日记录中不出现由该驳回申请产生的校准结果
  status: active
  source_context:
    quote: 补卡申请仅在开关开启后出现于【审批】应用；审批未通过时打卡状态不得变化。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 可测试的关键判定点
- id: TC-ATT-1006
  fp_id: FP-10
  scenario_id: SC-FP-10-02
  point_id: TP-FP-10-02-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在补卡申请已提交但审批未通过、或仍在流转中的条件下，验原异常打卡状态是否保持不变。
  test_point: 补卡申请审批未通过时，该员工当日的异常打卡状态保持原值，不出现任何自动校准。
  title: 让三张同类补卡申请分别处于通过、驳回、待审批状态后比对状态取值
  design_method: 因果图法
  tags:
  - 异常
  - 数据一致性
  severity: S2
  severity_reason: 三种审批结果中只要有一种把状态改了，考勤结论就与审批结论脱钩，员工可通过制造状态差异获得不应有的正常记录。
  preconditions: 补卡开关已开启；员工 A、C、D 当日均有下班早退异常并各自提交了补卡申请；三人的上级 B 为同一审批人。
  steps:
  - 上级 B 审批通过 A 的补卡申请
  - 上级 B 驳回 C 的补卡申请
  - 让 D 的补卡申请停留在待审批状态不做处理
  - 分别查看 A、C、D 当日打卡状态
  expected:
  - A（审批通过）的打卡状态变为正常
  - C（审批驳回）的打卡状态保持早退异常
  - D（待审批）的打卡状态保持早退异常
  status: active
  source_context:
    quote: 补卡申请仅在开关开启后出现于【审批】应用；审批未通过时打卡状态不得变化。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 可测试的关键判定点
- id: TC-ATT-1007
  fp_id: FP-10
  scenario_id: SC-FP-10-02
  point_id: TP-FP-10-02-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在补卡申请已提交但审批未通过、或仍在流转中的条件下，验原异常打卡状态是否保持不变。
  test_point: 补卡申请审批未通过时，该员工当日的异常打卡状态保持原值，不出现任何自动校准。
  title: 对当日没有迟到早退的打卡记录提交补卡申请并由上级通过
  design_method: 异常法
  tags:
  - 异常
  - 待确认
  severity: S3
  severity_reason: 无异常可校正的单据若被通过，会产生指向不存在异常的校准记录，污染校准状态列并干扰人事核对。
  preconditions: 补卡开关已开启；员工 A 当日按时上下班，打卡记录中无迟到、早退异常；A 的上级 B 为审批人。
  steps:
  - 员工 A 在【审批】应用中尝试就当日提交补卡申请
  - 若申请可提交，由上级 B 审批通过
  - 查看 A 当日打卡状态与校准状态
  expected:
  - 待确认：员工当日没有迟到/早退异常时，是否允许提交补卡申请？若允许且审批通过，系统对不存在的异常是否完全不产生状态变更与校准记录？
  status: pending_confirmation
  source_context:
    quote: 补卡申请仅在开关开启后出现于【审批】应用；审批未通过时打卡状态不得变化。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 可测试的关键判定点
- id: TC-ATT-1008
  fp_id: FP-10
  scenario_id: SC-FP-10-03
  point_id: TP-FP-10-03-01
  functional_point: 补卡申请与审批修正异常
  scenario: 在打卡规则未勾选补卡申请开关的条件下，验【审批】应用中是否存在补卡申请入口，以及是否存在绕过上级审批直接改变打卡状态的路径。
  test_point: 打卡规则未勾选补卡申请开关时，【审批】应用中不出现补卡申请，员工无法发起补卡申请。
  title: 关闭补卡开关后在审批应用中查找补卡申请模板并尝试发起
  design_method: 逆向场景法
  tags:
  - 异常
  - 权限
  severity: S2
  severity_reason: 开关关闭后仍能发起补卡申请，意味着企业对补卡通道的开关控制失效，未开通该制度的企业也会收到补卡单。
  preconditions: 打卡规则未勾选「员工异常打卡时可提交申请，审批通过后修正异常」；员工 A 当日上班迟到形成异常记录。
  steps:
  - 在【管理后台】>【企业应用】>【审批】中查看当前可用审批模板列表
  - 以员工 A 的账号打开【审批】应用，查找补卡相关模板
  - 让 A 尝试就当日迟到异常发起补卡
  expected:
  - 【审批】应用的可发起模板中不出现补卡申请
  - A 无法发起补卡申请，当日打卡状态保持迟到异常
  status: active
  source_context:
    quote: 补卡申请仅在开关开启后出现于【审批】应用；审批未通过时打卡状态不得变化。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 可测试的关键判定点
