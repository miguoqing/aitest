  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-01
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: 同一时间范围下 API 导出的打卡记录与后台 Excel 导出的记录逐条一致。
  title: 同一月份分别从按月统计 Tab 与接口取数，比对三个人的月度汇总数值
  design_method: 场景法
  tags:
  - 数据准确性
  - 导出
  severity: S2
  severity_reason: 月度汇总数不一致时，按接口汇总出的工资报表与后台核对结果对不上，整月数据需要人工重新核算。
  preconditions: 部门 E 共 3 人，2026-09 整月打卡记录已生成；后台【按月统计】Tab 可导出该月汇总；超级管理员 access_token 可用。
  steps:
  - 在后台【按月统计】Tab 导出部门 E 的 2026-09 汇总 Excel
  - 调用导出接口取 2026-09-01 至 2026-09-30 部门 E 的打卡记录
  - 用接口返回的记录自行汇总 3 人的出勤天数、迟到次数、缺卡天数
  - 逐人比对汇总值与后台按月统计值
  expected:
  - 3 人的出勤天数在两侧相同
  - 3 人的迟到次数在两侧相同
  - 3 人的缺卡天数在两侧相同
  status: active
  source_context:
    quote: API 导出数据应与后台导出在相同时间范围下口径一致。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
