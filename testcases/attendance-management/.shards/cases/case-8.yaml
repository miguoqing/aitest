- id: TC-ATT-2310
  fp_id: FP-23
  scenario_id: SC-FP-23-02
  point_id: TP-FP-23-02-01
  functional_point: API 导出通道与后台口径一致
  scenario: 调用方为非管理员或未获授权的应用时，验证接口对调用方身份的访问控制
  test_point: 非管理员或未获授权的应用调用导出接口时被拒绝，响应中不含任何打卡数据。
  title: 用一名无管理员身份的普通员工 access_token 调用导出接口请求全员整月数据
  design_method: 安全性法
  tags:
  - 安全
  - 权限
  severity: S1
