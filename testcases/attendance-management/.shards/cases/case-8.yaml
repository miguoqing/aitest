- id: TC-ATT-2314
  fp_id: FP-23
  scenario_id: SC-FP-23-03
  point_id: TP-FP-23-03-01
  functional_point: API 导出通道与后台口径一致
  scenario: 请求的时间范围内不存在任何打卡记录时，验证接口返回结构与非空字段的表达方式
  test_point: 请求时间范围内无打卡记录时，接口返回空数据集而非报错或全量数据。
  title: 取三种不含任何打卡记录的边界区间分别调用导出接口，检查返回的记录集合
  design_method: 边界值法
  tags:
  - 边界
  - 数据准确性
  severity: S2
  severity_reason: 无记录区间若返回全量数据，集成方按区间做的月度结算会把其他日期或其他员工的记录算进来。
  preconditions: 员工 D 在 2026-09-11 的打卡为 09:02 与 18:31；2026-09-12 为休息日无任何打卡；2026-09-13 08:30 有一条打卡；超级管理员 access_token 可用。
  steps:
  - 调用导出接口取 2026-09-11 12:00:00 至 2026-09-11 13:00:00，即当天两次打卡之间的空隙
  - 调用导出接口取 2026-09-12 00:00:00 至 2026-09-12 23:59:59，即整天无打卡
  - 调用导出接口取 2026-09-11 19:00:00 至 2026-09-12 23:59:59，即跨日且两端都无打卡
  - 读取三次响应的记录集合与记录数
  expected:
  - 12:00 至 13:00：返回空数据集，不含 09:02 与 18:31 两条记录
  - 09-12 全天：返回空数据集，记录数为 0
  - 19:00 至次日 23:59：返回空数据集，不含 18:31 与 09-13 08:30 的记录
  status: active
  source_context:
    quote: API 导出数据应与后台导出在相同时间范围下口径一致。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
