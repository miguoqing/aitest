- id: TC-ATT-2306
  fp_id: FP-23
  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-02
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: API 导出与后台导出互为并列通道，调用 API 不改变后台导出内容，后台侧的导出记录也不改变 API 的返回结果。
  title: 先经接口导出整月记录，再从后台导出同一区间，核对后台导出是否被这次调用改变
  design_method: 场景法
  tags:
  - 正向
  - 数据一致性
  severity: S2
  severity_reason: 后台导出是人工核对的基准，一旦被接口调用改变，管理员每次复核看到的数都可能不同，核对结论失去基准。
  preconditions: 已在未调用任何接口的情况下导出 2026-09 整月 Excel 并存档为基线；超级管理员 access_token 可用。
  steps:
  - 调用导出接口取 2026-09-01 至 2026-09-30 的全员记录
  - 在后台【按日统计】Tab 导出同一区间 2026-09-01 至 2026-09-30 的 Excel
  - 把新导出的 Excel 与基线逐行比对记录条数与考勤判定列
  expected:
  - 新导出的记录条数与基线相同
  - 每条记录的考勤判定列与基线相同
  status: active
  source_context:
    quote: 这条路径与后台 Excel 导出是并列通道，面向的是系统间集成而非人工核对。
    path: wiki/attendance-management/permissions-and-export.md
    section: API 导出数据
- id: TC-ATT-2307
  fp_id: FP-23
  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-02
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: API 导出与后台导出互为并列通道，调用 API 不改变后台导出内容，后台侧的导出记录也不改变 API 的返回结果。
  title: 接口按 A 部门导出后紧接着把后台筛选切到 B 部门导出，检查两侧筛选条件是否串用
  design_method: 错误推测法
  tags:
  - 异常
  - 数据准确性
  severity: S2
  severity_reason: 两条通道若共用同一个导出任务对象，后一次调用的条件会覆盖前一次，后台导出里混入其他部门员工，人工核对与工资分摊都会算错人。
  preconditions: 部门 A 与部门 B 各有 3 名在职员工且当月均有打卡；后台可按部门筛选导出；超级管理员 access_token 可用。
  steps:
  - 调用导出接口取 2026-09-01 至 2026-09-30 部门 A 的记录
  - 紧接着在后台把筛选条件设为部门 B，导出同一区间的 Excel
  - 检查后台导出结果涉及哪些员工，再回查接口返回涉及哪些员工
  expected:
  - 后台导出结果只包含部门 B 的员工，不含部门 A 独有员工
  - 接口返回结果只包含部门 A 的员工，不含部门 B 独有员工
  status: active
  source_context:
    quote: 这条路径与后台 Excel 导出是并列通道，面向的是系统间集成而非人工核对。
    path: wiki/attendance-management/permissions-and-export.md
    section: API 导出数据
- id: TC-ATT-2308
  fp_id: FP-23
  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-02
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: API 导出与后台导出互为并列通道，调用 API 不改变后台导出内容，后台侧的导出记录也不改变 API 的返回结果。
  title: 按全员、单部门、单人三种调用范围分别导出，每次回查后台同条件导出的条数
  design_method: 等价类划分
  tags:
  - 数据准确性
  - 导出
  severity: S3
  severity_reason: 某类调用范围反向影响后台导出时，影响面局限在集成方的核对流程，管理员仍可换时间段重导，不会丢失数据。
  preconditions: 全员、部门 E（3 人）、员工 D 三类范围的后台基线导出结果均已存档；超级管理员 access_token 可用。
  steps:
  - 调用导出接口按全员范围取 2026-09-01 至 2026-09-30 的记录
  - 调用导出接口按部门 E 范围取同一区间
  - 调用导出接口按员工 D 范围取同一区间
  - 每次调用后在后台按相同范围导出一份 Excel，与对应基线比对条数
  expected:
  - 全员范围：调用后后台导出条数与全员基线相同
  - 单部门范围：调用后后台导出条数与部门基线相同
  - 单人范围：调用后后台导出条数与个人基线相同
  status: active
  source_context:
    quote: 这条路径与后台 Excel 导出是并列通道，面向的是系统间集成而非人工核对。
    path: wiki/attendance-management/permissions-and-export.md
    section: API 导出数据
