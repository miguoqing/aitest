cases:
- id: TC-ATT-2301
  fp_id: FP-23
  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-01
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: 同一时间范围下 API 导出的打卡记录与后台 Excel 导出的记录逐条一致。
  title: 取同一整月区间，按员工当月打卡记录的三种覆盖程度分别比对两侧记录条数
  design_method: 等价类划分
  tags:
  - 数据一致性
  - 导出
  severity: S1
  severity_reason: 两侧记录条数或有记录日期不一致时，工资与假期结算会按错误的天数计算，且出错后无法从导出结果判断该以哪一侧为准。
  preconditions: 2026-09-01 至 2026-09-30 的后台导出可用；同一部门下准备员工 A（当月每天上下班各一次）、员工 B（当月 10 天有记录、其余日期缺卡）、员工 C（当月无任何打卡）；持有超级管理员 access_token。
  steps:
  - 在【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】>【按日统计】导出 2026-09-01 至 2026-09-30 的 Excel
  - 用超级管理员 access_token 调用打卡数据导出接口，请求同一区间 2026-09-01 至 2026-09-30
  - 把两份结果分别按员工 A、B、C 分组，统计每人的记录条数与有记录的日期
  - 逐个员工比对两侧的条数与有记录日期集合
  expected:
  - 员工 A：两侧各返回 30 天上下班记录，条数相同且有记录日期完全一致
  - 员工 B：两侧记录条数相同，有记录的 10 个日期完全相同
  - 员工 C：两侧都不返回该员工的打卡记录，均未退化为返回全公司数据
  status: active
  source_context:
    quote: API 导出数据应与后台导出在相同时间范围下口径一致。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2302
  fp_id: FP-23
  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-01
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: 同一时间范围下 API 导出的打卡记录与后台 Excel 导出的记录逐条一致。
  title: 逐一切换正常、迟到、早退、缺卡四种打卡状态，核对两侧导出的状态判定列
  design_method: 穷举法
  tags:
  - 数据准确性
  - 导出
  severity: S2
  severity_reason: 某个状态的判定列在两侧不一致时，按接口结果做的月度考勤汇总会把该状态的次数算错，需逐月人工复核。
  preconditions: 员工 D 在 2026-09-07 至 2026-09-10 四天分别呈现正常、迟到、早退、缺卡（09-10 无任何打卡）；规则为固定时间上下班；超级管理员 access_token 可用。
  steps:
  - 在后台【按日统计】Tab 导出 2026-09-07 至 2026-09-10 的 Excel
  - 调用导出接口取同一区间 2026-09-07 至 2026-09-10 的记录
  - 按日期对齐两份结果，逐个日期读取状态判定列
  - 记录四种状态下两侧的判定值
  expected:
  - 09-07 正常：两侧判定均为正常
  - 09-08 迟到：两侧判定均为迟到，迟到分钟数相同
  - 09-09 早退：两侧判定均为早退，早退分钟数相同
  - 09-10 缺卡：后台标记缺卡，接口该日不返回打卡记录，两侧缺卡天数统计相同
  status: active
  source_context:
    quote: API 导出数据应与后台导出在相同时间范围下口径一致。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2303
  fp_id: FP-23
  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-01
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: 同一时间范围下 API 导出的打卡记录与后台 Excel 导出的记录逐条一致。
  title: 用一名员工一个工作日的两次打卡走通后台导出与接口导出，逐字段比对打卡时间与打卡地点
  design_method: 场景法
  tags:
  - 正向
  - 数据一致性
  severity: S2
  severity_reason: 主链路上两侧字段对不齐时，集成方拿不到可直接用于结算的记录，只能退回人工比对，接口通道失去替代后台导出的能力。
  preconditions: 员工 D 在 2026-09-11 有上班 09:02、下班 18:31 两次手机打卡，打卡地点为办公地点；超级管理员 access_token 可用。
  steps:
  - 在后台【按日统计】Tab 导出 2026-09-11 的 Excel，读出 D 的两次打卡时间与打卡地点
  - 调用导出接口取 2026-09-11 00:00:00 至 2026-09-11 23:59:59 的记录，读出 D 的两次打卡
  - 逐字段比对两次打卡的时间、地点与当日考勤判定
  expected:
  - 两侧都返回 D 在 2026-09-11 的两次打卡记录
  - 两次打卡的时间 09:02 与 18:31 在两侧完全相同
  - 两次打卡的打卡地点在两侧完全相同
  - 两侧对该日的考勤判定相同
  status: active
  source_context:
    quote: API 导出数据应与后台导出在相同时间范围下口径一致。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2304
