    section: 查看与导出打卡记录
- id: TC-ATT-2103
  fp_id: FP-21
  scenario_id: SC-FP-21-01
  point_id: TP-FP-21-01-01
  functional_point: 打卡记录的筛选
  scenario: 打卡记录同时存在多个部门、多名人员与多种打卡状态时，验证按时间、部门、打卡人员、打卡状态中任一单条件筛选后的结果集合
  test_point: 按时间、部门、打卡人员、打卡状态中任一单条件筛选后，结果集只包含满足该条件的记录。
  title: 以时间条件为主线走完整查询链路，先取宽区间再收窄核对日期列
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 时间条件未生效时列表会混入区间外的记录，管理员按日期核对出勤时整段范围的判断都失去依据
  preconditions: 打卡记录覆盖 2026-10-01 至 2026-10-16，其中 2026-10-09 之后没有产生新记录；当前登录账号为超级管理员
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】，确认未设置任何条件时的列表状态
  - 在顶部工具栏把时间条件设为 2026-10-01 至 2026-10-16 后查询，逐页浏览结果集并核对日期列
  - 把时间条件收窄为 2026-10-01 至 2026-10-08 后再次查询，逐页核对日期列
  expected:
  - 时间条件为 2026-10-01 至 2026-10-16 时结果集中出现 10-09 至 10-16 的记录
  - 时间条件收窄为 2026-10-01 至 2026-10-08 后结果集中不再出现 10-09 及以后的记录
  status: active
  source_context:
    quote: 筛选：顶部工具栏可按时间、部门、打卡人员、打卡状态筛选打卡记录。
    path: wiki/attendance-management/permissions-and-export.md
    section: 查看与导出打卡记录
- id: TC-ATT-2104
  fp_id: FP-21
  scenario_id: SC-FP-21-02
  point_id: TP-FP-21-02-01
  functional_point: 打卡记录的筛选
  scenario: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
  test_point: 时间、部门、打卡人员、打卡状态四个条件同时生效时，结果集是四个条件各自结果集的交集。
  title: 四个条件同时施加后比对结果条数与各单条件结果集的交集条数
  design_method: 因果图法
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 交集口径算错会让筛选结果与导出报表同时失真，管理员据此刻意出的考勤报表数字错误且对外发出后难以回收
  preconditions: 已预先统计四条件单独作用时的结果：时间 2026-10-12 至 2026-10-16 命中 15 条、部门研发部 9 条、人员张三 5 条、状态迟到 3 条；四条件同时满足的记录 1 条
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】
  - 依次单独施加时间、部门、人员、状态四个条件，分别记录每次的结果条数
  - 四个条件全部保留后执行一次组合查询，记录结果条数与记录内容
  - 打开结果集中每条记录，核对日期、部门、人员、状态四列
  expected:
  - 四条件组合查询的结果条数为 1，等于各单条件结果集的交集条数，不等于任一单条件的条数
  - 该记录的日期落在 2026-10-12 至 2026-10-16、部门为研发部、人员为张三、状态为迟到
  status: active
  source_context:
    quote: 筛选条件（时间、部门、打卡人员、打卡状态）组合使用时结果应取交集。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2105
  fp_id: FP-21
  scenario_id: SC-FP-21-02
  point_id: TP-FP-21-02-01
  functional_point: 打卡记录的筛选
  scenario: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
  test_point: 时间、部门、打卡人员、打卡状态四个条件同时生效时，结果集是四个条件各自结果集的交集。
  title: 按命中条件个数预置记录后逐条查找，确认只保留四个条件全中的那一条
  design_method: 等价类划分
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 记录级过滤放漏会把不满足条件的打卡算进结果，按此核对出的出勤明细与事实不符
  preconditions: 已预置四条记录：四条件全命中 1 条、只未命中状态 1 条、只未命中人员 1 条、四条件全不命中 1 条；条件取 2026-10-12 至 2026-10-16、研发部、张三、迟到
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】
  - 把时间、部门、人员、状态四个条件按上述取值全部设置后查询
  - 在结果集中按日期、部门、人员、状态逐条查找预置的四条记录是否存在
  expected:
  - 只有四条件全命中的那条记录出现在结果集
  - 只未命中状态、只未命中人员、四条件全不命中的三条记录都不出现在结果集
  status: active
  source_context:
    quote: 筛选条件（时间、部门、打卡人员、打卡状态）组合使用时结果应取交集。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2106
  fp_id: FP-21
  scenario_id: SC-FP-21-02
  point_id: TP-FP-21-02-01
  functional_point: 打卡记录的筛选
  scenario: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
  test_point: 时间、部门、打卡人员、打卡状态四个条件同时生效时，结果集是四个条件各自结果集的交集。
  title: 从无条件查询起逐层叠加条件，记录每一步的结果条数变化
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 叠加条件时结果反而变大说明条件被并集处理，管理员按逐层收窄的方式找名单会拿到比预期更宽的范围
  preconditions: 打卡记录中有 2026-10-12 至 2026-10-16 的多部门多人记录；当前登录账号为超级管理员
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】，记录未加条件时的结果条数
  - 只加时间条件 2026-10-12 至 2026-10-16 查询并记录结果条数
  - 在此基础上叠加部门条件「研发部」查询并记录结果条数
  - 再叠加人员条件「张三」与状态条件「迟到」查询并记录结果条数
  expected:
  - 四次查询的结果条数逐次不增，即无条件不少于时间条件，时间条件不少于时间加部门，时间加部门不少于四条件全选
  - 末次查询结果中每条记录都同时满足时间、部门、人员、状态四个条件
  status: active
  source_context:
    quote: 筛选条件（时间、部门、打卡人员、打卡状态）组合使用时结果应取交集。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2107
  fp_id: FP-21
  scenario_id: SC-FP-21-02
  point_id: TP-FP-21-02-02
  functional_point: 打卡记录的筛选
  scenario: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
  test_point: 组合筛选中任一维度不满足的记录都不出现在结果集里，交集不退化回并集。
  title: 用互不相交的部门条件与状态条件组合查询，确认结果为空集
  design_method: 因果图法
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 互斥条件返回并集时两组互不相关的记录同时混入，筛选与导出结果整体错位，基于此产出的报表数字全错
  preconditions: 研发部 2026-10-12 至 2026-10-16 的打卡状态均为正常、无迟到记录；销售部王五同期有 1 条迟到记录
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】
  - 设置时间条件 2026-10-12 至 2026-10-16 与部门条件「研发部」后查询，记录结果条数
  - 在部门条件保持研发部的前提下叠加状态条件「迟到」后查询，记录结果条数与结果集内容
  expected:
  - 部门为研发部且状态为迟到的组合查询结果条数为 0，结果集为空
  - 该空结果中既不出现研发部的正常记录，也不出现销售部王五的迟到记录
  status: active
  source_context:
    quote: 筛选条件（时间、部门、打卡人员、打卡状态）组合使用时结果应取交集。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
- id: TC-ATT-2108
  fp_id: FP-21
  scenario_id: SC-FP-21-02
  point_id: TP-FP-21-02-02
  functional_point: 打卡记录的筛选
  scenario: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
  test_point: 组合筛选中任一维度不满足的记录都不出现在结果集里，交集不退化回并集。
  title: 从只按状态筛选的结果上追加部门条件，检查上一轮记录是否残留
  design_method: 逆向场景法
  tags:
  - 回归
  - 数据准确性
  severity: S1
  severity_reason: 在已出结果上追加条件时若沿用上一轮结果，新条件形同虚设，迟报名单会混入其他部门的人并被直接用于统计
  preconditions: 销售部王五在 2026-10-12 至 2026-10-16 有 1 条迟到记录；研发部同期有 2 条迟到记录
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】
  - 只设置状态条件「迟到」后查询，确认结果集中出现销售部王五的迟到记录并记录条数
  - 在状态条件保留的前提下追加部门条件「研发部」后查询
  - 检查结果集中是否还残留销售部王五的记录，并核对结果条数
  expected:
  - 追加部门条件后结果集中不再出现销售部王五的迟到记录
  - 结果条数为 2，等于研发部与迟到两条件同时满足的记录数，少于只按迟到筛选时的条数
