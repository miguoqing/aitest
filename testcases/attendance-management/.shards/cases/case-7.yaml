  functional_point: 打卡记录的筛选
  scenario: 打卡记录同时存在多个部门、多名人员与多种打卡状态时，验证按时间、部门、打卡人员、打卡状态中任一单条件筛选后的结果集合
  test_point: 按时间、部门、打卡人员、打卡状态中任一单条件筛选后，结果集只包含满足该条件的记录。
  title: 逐个取值打卡状态条件后各查一次，核对每次结果集的状态列
  design_method: 穷举法
  tags:
  - 待确认
  - 数据准确性
  severity: S2
  severity_reason: 状态取值范围未闭合时无法证明每个状态值都能独立筛出记录，漏掉的状态值会让该状态的记录整类不可查
  preconditions: 打卡数据中已存在覆盖各个打卡状态取值的记录；当前登录账号为超级管理员
  steps:
