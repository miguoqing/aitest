cases:
- id: TC-ATT-2101
  fp_id: FP-21
  scenario_id: SC-FP-21-01
  point_id: TP-FP-21-01-01
  functional_point: 打卡记录的筛选
  scenario: 打卡记录同时存在多个部门、多名人员与多种打卡状态时，验证按时间、部门、打卡人员、打卡状态中任一单条件筛选后的结果集合
  test_point: 按时间、部门、打卡人员、打卡状态中任一单条件筛选后，结果集只包含满足该条件的记录。
  title: 把部门条件分别取研发部与销售部各查一次，核对结果集的部门列
  design_method: 等价类划分
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 部门条件失效会把其他部门的记录混进当前视图，管理员据此核对出勤或导出报表时会取到错误的部门口径
  preconditions: 打卡记录中已有研发部张三、李四与销售部王五三人在 2026-10-12 至 2026-10-16 的打卡数据；当前登录账号为超级管理员
  steps:
  - 进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】
  - 在顶部工具栏把部门条件设为「研发部」后查询，记录结果集的部门列取值与记录条数
  - 把部门条件改为「销售部」后重新查询，记录结果集的部门列取值与记录条数
  - 逐页浏览两次结果集，按人员列核对是否混入另一部门的人员
  expected:
  - 部门条件取「研发部」时结果集每条记录的部门列都是研发部，不出现王五的记录
  - 部门条件取「销售部」时结果集每条记录的部门列都是销售部，不出现张三与李四的记录
  status: active
  source_context:
    quote: 筛选：顶部工具栏可按时间、部门、打卡人员、打卡状态筛选打卡记录。
    path: wiki/attendance-management/permissions-and-export.md
    section: 查看与导出打卡记录
