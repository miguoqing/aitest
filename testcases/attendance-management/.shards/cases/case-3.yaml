  point_id: TP-FP-03-01-02
  functional_point: 打卡方式与凭证来源
  scenario: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
  test_point: 员工未进入定位有效范围但连上办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
  title: 定位漂移到办公范围外时用办公 Wi-Fi 完成一次打卡并核对记录
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: Wi-Fi 放行链路失效时，位置漂移的员工会被判缺卡，考勤结论只能靠人工申诉纠正
  preconditions: 固定时间规则已绑定测试员工；员工手机已连接办公 Wi-Fi；手机定位显示在办公地点 1 公里外
  steps:
  - 员工在定位漂移到办公地点 1 公里外的状态下连接办公 Wi-Fi
  - 用手机企业微信点击打卡
  - 在管理后台打开该员工当日打卡记录并核对打卡地点
  expected:
  - 打卡成功并生成当日手机打卡记录
  - 该记录的打卡地点显示为办公地点
  status: active
  source_context:
    quote: 手机打卡的两条依据（定位、办公 WIFI）为「或」关系，任一满足即应放行；智能考勤机方式下其他设备打卡应被拒绝。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
- id: TC-ATT-0306
  fp_id: FP-03
  scenario_id: SC-FP-03-02
  point_id: TP-FP-03-02-01
  functional_point: 打卡方式与凭证来源
  scenario: 规则按设备名称选定智能考勤机后，验规则内人员在指定设备与非指定设备上打卡的记录归属差异。
  test_point: 采用智能考勤机方式的规则，打卡人只能在规则选定的考勤机上打卡，在其他考勤机上的打卡不产生有效记录。
  title: 在未被规则选中的考勤机上打卡后核对记录归属
  design_method: 逆向场景法
  tags:
  - 异常
  - 数据准确性
  severity: S2
  severity_reason: 非指定设备若能落成有效记录，设备维度的考勤归属就失去意义，跨点代打卡无法被发现
  preconditions: 规则采用智能考勤机方式并已选中考勤机 A；测试员工在规则人员范围内；公司另有考勤机 B
  steps:
  - 员工在考勤机 B 上验证并按下打卡
  - 管理员在【打卡】>【查看】中按该员工筛选当日记录
  - 员工再在考勤机 A 上打卡并复查记录
  expected:
  - 考勤机 B 上的打卡不成立为该员工当日有效打卡记录
  - 考勤机 A 上的打卡成立并写入当日打卡记录
  status: active
  source_context:
    quote: 智能考勤机——打卡人只能在指定考勤机上打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
