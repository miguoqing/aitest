  fp_id: FP-03
  scenario_id: SC-FP-03-02
  point_id: TP-FP-03-02-01
  functional_point: 打卡方式与凭证来源
  scenario: 规则按设备名称选定智能考勤机后，验规则内人员在指定设备与非指定设备上打卡的记录归属差异。
  test_point: 采用智能考勤机方式的规则，打卡人只能在规则选定的考勤机上打卡，在其他考勤机上的打卡不产生有效记录。
  title: 在指定考勤机上打卡后从手机与电脑两端查看同步记录
  design_method: 场景法
  tags:
