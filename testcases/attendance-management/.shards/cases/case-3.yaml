cases:
- id: TC-ATT-0301
  fp_id: FP-03
  scenario_id: SC-FP-03-01
  point_id: TP-FP-03-01-01
  functional_point: 打卡方式与凭证来源
  scenario: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
  test_point: 员工手机定位落在有效范围内但未连办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
  title: 用定位命中与办公 Wi-Fi 未命中的条件组合提交一次手机打卡
  design_method: 因果图法
  tags:
  - 正向
  - 集成
  severity: S2
  severity_reason: 「或」关系被实现成「与」时，只靠定位的员工无法打卡，会整月产生缺卡记录，需要人工逐条纠正
  preconditions: 固定时间规则已绑定测试员工；办公地点有效范围已配置；该员工手机未连接办公 Wi-Fi
  steps:
  - 员工站在办公地点有效范围内，确认手机 Wi-Fi 处于关闭状态
  - 打开企业微信打卡应用并点击打卡
  - 在【管理后台】>【企业应用】>【打卡】>【查看】中打开该员工当日打卡记录
  expected:
  - 定位命中、办公 Wi-Fi 未命中这一条件组合下页面提示打卡成功
  - 该员工当日新增 1 条来源为手机打卡的打卡记录
  status: active
  source_context:
    quote: 手机打卡——系统确认打卡人位置，或判断打卡人是否连上办公地点的 WIFI，满足其中任意一项即可打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0302
  fp_id: FP-03
  scenario_id: SC-FP-03-01
  point_id: TP-FP-03-01-01
  functional_point: 打卡方式与凭证来源
  scenario: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
  test_point: 员工手机定位落在有效范围内但未连办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
  title: 在办公范围内两个不同位置各提交一次手机打卡
  design_method: 等价类划分
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 有效位置的代表值若被漏判，员工在部分办公区域无法打卡，缺卡记录会直接进入考勤结论
  preconditions: 固定时间规则已绑定测试员工；办公地点有效范围已配置；该员工手机未连接办公 Wi-Fi
  steps:
  - 员工在距办公地点约 150 米处打开企业微信并点击打卡
  - 员工在距办公地点约 250 米处再次点击打卡
  - 在管理后台打开该员工当日打卡记录，逐条核对两次打卡
  expected:
  - 距办公地点约 150 米处的打卡成功，当日记录中出现该次打卡
  - 距办公地点约 250 米处的打卡成功，当日记录中出现该次打卡
  status: active
  source_context:
    quote: 手机打卡——系统确认打卡人位置，或判断打卡人是否连上办公地点的 WIFI，满足其中任意一项即可打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0303
  fp_id: FP-03
  scenario_id: SC-FP-03-01
  point_id: TP-FP-03-01-01
  functional_point: 打卡方式与凭证来源
  scenario: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
  test_point: 员工手机定位落在有效范围内但未连办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
  title: 从新建规则到后台查记录的手机打卡主链路
  design_method: 场景法
  tags:
  - 正向
  - 冒烟
  severity: S1
  severity_reason: 打卡记录未落库会让员工当日直接判为缺卡，考勤结论错误且事后只能用补卡申诉逐条修正
  preconditions: 测试部门与测试员工已存在；管理员账号已具备打卡应用管理权限
  steps:
  - 在【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【添加规则】中新建固定时间规则并添加测试员工
  - 员工在办公地点范围内用手机企业微信完成一次打卡
  - 管理员进入【打卡】>【查看】打开当日打卡记录列表并定位该员工
  expected:
  - 打卡记录列表中出现该员工当日的手机打卡记录，含打卡时间与打卡地点
  - 该员工当日考勤结论不为缺卡
  status: active
  source_context:
    quote: 手机打卡——系统确认打卡人位置，或判断打卡人是否连上办公地点的 WIFI，满足其中任意一项即可打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0304
  fp_id: FP-03
  scenario_id: SC-FP-03-01
  point_id: TP-FP-03-01-02
  functional_point: 打卡方式与凭证来源
  scenario: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
  test_point: 员工未进入定位有效范围但连上办公 Wi-Fi 时，手机端仍直接产生一条打卡记录。
  title: 关闭手机定位后仅凭办公 Wi-Fi 提交一次手机打卡
  design_method: 因果图法
  tags:
  - 正向
  - 集成
  severity: S2
  severity_reason: 定位不可用时办公 Wi-Fi 是唯一放行条件，该条件失效会让室内员工集体无法打卡
  preconditions: 固定时间规则已绑定测试员工；员工手机已连接办公 Wi-Fi；手机定位服务处于关闭状态
  steps:
  - 确认手机定位服务处于关闭状态
  - 打开企业微信打卡应用并点击打卡
  - 在管理后台打开该员工当日打卡记录
  expected:
  - 定位不可用、办公 Wi-Fi 命中的条件组合下页面提示打卡成功
  - 该员工当日新增 1 条来源为手机打卡的打卡记录
  status: active
  source_context:
    quote: 手机打卡的两条依据（定位、办公 WIFI）为「或」关系，任一满足即应放行；智能考勤机方式下其他设备打卡应被拒绝。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
