  - 集成
  severity: S3
  severity_reason: 同步延迟会让员工误以为没打上卡而重复打卡，但指定设备这条主路径仍可用，影响限于核对体验
  preconditions: 规则采用智能考勤机方式并已选中联网的考勤机 A；测试员工在规则人员范围内
