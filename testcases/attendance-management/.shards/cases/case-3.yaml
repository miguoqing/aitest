- id: TC-ATT-0309
  fp_id: FP-03
  scenario_id: SC-FP-03-02
  point_id: TP-FP-03-02-02
  functional_point: 打卡方式与凭证来源
  scenario: 规则按设备名称选定智能考勤机后，验规则内人员在指定设备与非指定设备上打卡的记录归属差异。
  test_point: 规则按设备名称选定考勤机后，规则内打卡人员的打卡只在被选中的该台设备上成立，在其他设备上不成立。
  title: 按设备名称选中考勤机后核对规则详情中的绑定设备
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 绑定设备保存错位会让整条规则的人员在错误设备上打卡，成批考勤记录作废
  preconditions: 企业下已存在两台可用智能考勤机 A 与 B；管理员已登录管理后台
  steps:
  - 在【添加规则】中把打卡方式选为智能考勤机
  - 在设备列表中按名称选中考勤机 A 并保存规则
  - 重新打开该规则详情查看打卡设备
  expected:
