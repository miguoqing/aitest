- id: TC-ATT-0401
  fp_id: FP-04
  scenario_id: SC-FP-04-01
  point_id: TP-FP-04-01-01
  functional_point: 打卡地点与设备范围校验
  scenario: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界
  test_point: 定位距办公地点 100 米与 300 米处的手机打卡都落在有效范围内并被放行，超出 300 米处的打卡不被放行。
  title: 在距办公地点 100 米、300 米与 301 米处分别提交手机打卡
  design_method: 边界值法
  tags:
  - 边界
  - 数据准确性
  severity: S1
  severity_reason: 300 米之外仍被放行时员工可在办公区域外完成打卡，考勤地点数据失真且事后无法从记录中识别。
  preconditions: 规则为固定时间上下班并已添加以办公地点为中心的打卡位置；准备三名可模拟定位的测试员工 A、B、C。
  steps:
  - 把员工 A 的手机定位模拟到距办公地点 100 米处，提交上班打卡
  - 把员工 B 的手机定位模拟到距办公地点 300 米处，提交上班打卡
  - 把员工 C 的手机定位模拟到距办公地点 301 米处，提交上班打卡
  - 在【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】中打开三人的当日打卡记录
  expected:
  - A 在 100 米处的打卡被受理，打卡记录中新增该次记录
  - B 在 300 米处的打卡被受理，打卡记录中新增该次记录
  - C 在 301 米处的打卡被拒绝，C 的打卡记录不新增该次记录
  status: active
  source_context:
    quote: 添加打卡位置时，以地图上的企业办公地点为中心，100至300米范围内均可成为打卡有效范围；员工携带装有企业微信的手机进入该区域即可打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0402
  fp_id: FP-04
  scenario_id: SC-FP-04-01
  point_id: TP-FP-04-01-01
  functional_point: 打卡地点与设备范围校验
  scenario: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界
  test_point: 定位距办公地点 100 米与 300 米处的手机打卡都落在有效范围内并被放行，超出 300 米处的打卡不被放行。
  title: 用不足 100 米、100 至 300 米、超过 300 米三档定位距离划分等价类
  design_method: 等价类划分
  tags:
  - 边界
  - 待确认
  severity: S2
  severity_reason: 不足 100 米这一档没有判定口径时，员工站在办公地点门口却打卡失败、或被判定为范围外，受理结论都无法解释。
  preconditions: 规则为固定时间上下班并已添加办公地点打卡位置；准备三名测试员工，可分别模拟 50 米、200 米、800 米定位。
  steps:
  - 把员工 A 的手机定位模拟到距办公地点 50 米处，提交上班打卡
  - 把员工 B 的手机定位模拟到距办公地点 200 米处，提交上班打卡
  - 把员工 C 的手机定位模拟到距办公地点 800 米处，提交上班打卡
  - 在打卡记录中查看三人的受理结果
  expected:
  - 待确认：定位距办公地点不足 100 米（例如 50 米）时，是否也属于打卡有效范围并被放行？
  status: pending_confirmation
  source_context:
    quote: 添加打卡位置时，以地图上的企业办公地点为中心，100至300米范围内均可成为打卡有效范围；员工携带装有企业微信的手机进入该区域即可打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0403
  fp_id: FP-04
  scenario_id: SC-FP-04-01
  point_id: TP-FP-04-01-01
  functional_point: 打卡地点与设备范围校验
  scenario: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界
  test_point: 定位距办公地点 100 米与 300 米处的手机打卡都落在有效范围内并被放行，超出 300 米处的打卡不被放行。
  title: 员工走进办公区域后完成一次手机上下班打卡
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 主链路走不通时员工在办公区域内无法完成打卡，当日考勤直接缺失。
  preconditions: 规则为固定时间上下班并已添加办公地点打卡位置；员工手机定位服务正常且已授权。
  steps:
  - 员工携带装有企业微信的手机走到办公地点，确认定位落在打卡范围内
  - 在手机端打开打卡应用，点击上班打卡
  - 当日下班时间到达后，再次点击下班打卡
  - 在【管理后台】打卡记录中打开该员工当日考勤明细
  expected:
  - 上班与下班两次打卡均生成记录
  - 两条记录的打卡时间与实际提交时间一致
  - 两条记录的打卡地点均为该办公地点
  status: active
  source_context:
    quote: 添加打卡位置时，以地图上的企业办公地点为中心，100至300米范围内均可成为打卡有效范围；员工携带装有企业微信的手机进入该区域即可打卡。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0404
  fp_id: FP-04
  scenario_id: SC-FP-04-01
  point_id: TP-FP-04-01-02
  functional_point: 打卡地点与设备范围校验
  scenario: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界
  test_point: 打卡有效范围的 100 至 300 米边界按打卡地点各自生效，一个地点设定的范围不套用到另一个地点。
  title: 给两个打卡地点各配 100 米与 300 米范围后到两地临界距离处打卡
  design_method: 边界值法
  tags:
  - 边界
  - 数据一致性
  severity: S2
  severity_reason: 范围配置跨地点串用会让某地点的有效范围被放大或缩小，打卡受理结论与该地点自己的配置不一致。
  preconditions: 规则为固定时间上下班；准备三名可模拟定位的测试员工 A、B、C。
  steps:
  - 在规则中添加打卡位置 A，把有效范围设为 100 米；添加打卡位置 B，把有效范围设为 300 米
  - 把员工 A 的定位模拟到距 A 100 米处，提交上班打卡
  - 把员工 B 的定位模拟到距 B 300 米处，提交上班打卡
  - 把员工 C 的定位模拟到距 A 150 米处，提交上班打卡
  - 在打卡记录中查看三人的受理结果
  expected:
  - A 在距 A 100 米处的打卡被受理
  - B 在距 B 300 米处的打卡被受理
  - C 在距 A 150 米处的打卡被拒绝，A 的 100 米范围未套用 B 的 300 米
  status: active
  source_context:
    quote: 打卡范围的边界值（100至300米）需按地点维度验证生效。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
- id: TC-ATT-0405
  fp_id: FP-04
  scenario_id: SC-FP-04-01
  point_id: TP-FP-04-01-02
  functional_point: 打卡地点与设备范围校验
  scenario: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界
  test_point: 打卡有效范围的 100 至 300 米边界按打卡地点各自生效，一个地点设定的范围不套用到另一个地点。
  title: 员工从 B 地点范围外走到范围内再完成一次打卡
  design_method: 场景法
  tags:
  - 正向
  - 数据一致性
  severity: S2
  severity_reason: 两地点范围互相影响时，某地点的打卡会在另一地点留下记录，考勤归属错乱。
  preconditions: 打卡位置 A 的有效范围设为 100 米、打卡位置 B 设为 300 米；同一员工当日未在其他地点打卡。
  steps:
  - 员工站到距 B 地点 350 米处，提交上班打卡
  - 员工走到距 B 地点 250 米处，再次提交上班打卡
  - 在打卡记录中比对 B 地点两次受理结果与该员工在 A 地点附近的当日记录
  expected:
  - 距 B 350 米处的打卡被拒绝
  - 距 B 250 米处的打卡被受理并生成记录
  - 该员工当日记录中不出现 A 地点的打卡记录
  status: active
  source_context:
    quote: 打卡范围的边界值（100至300米）需按地点维度验证生效。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
- id: TC-ATT-0406
  fp_id: FP-04
  scenario_id: SC-FP-04-02
  point_id: TP-FP-04-02-01
  functional_point: 打卡地点与设备范围校验
  scenario: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用
  test_point: 人数已达上限的考勤机不出现在可选打卡设备列表中，无法被规则选中。
  title: 把考勤机人数依次调到上限减一、恰好上限与上限加一后查可选设备列表
  design_method: 边界值法
  tags:
  - 边界
  severity: S2
  severity_reason: 达上限的设备仍可被选中会让超额人员被排进该设备，打卡时可能整批失败。
  preconditions: 企业已接入一台企业微信智能考勤机，已知其人数上限 N；具备把该设备人数调整为 N-1、N、N+1 的条件。
  steps:
  - 把考勤机人数调整为 N-1，在添加规则页查看智能考勤机的可选设备列表
  - 把人数调整为 N，刷新设备列表后再次查看
  - 把人数调整为 N+1，刷新设备列表后再次查看
  expected:
  - 人数为 N-1 时该考勤机出现在可选设备列表中
  - 人数为 N 时该考勤机不出现在可选设备列表中
  - 人数为 N+1 时该考勤机同样不出现在可选设备列表中
  status: active
  source_context:
    quote: 人数已达上限的考勤机不得出现在可选设备列表中；若已被规则引用后达到上限，需确认打卡是否被拒。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
- id: TC-ATT-0407
  fp_id: FP-04
  scenario_id: SC-FP-04-02
  point_id: TP-FP-04-02-01
  functional_point: 打卡地点与设备范围校验
  scenario: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用
  test_point: 人数已达上限的考勤机不出现在可选打卡设备列表中，无法被规则选中。
  title: 在添加规则页按设备名称检索并尝试勾选已达上限的考勤机
  design_method: 逆向场景法
  tags:
  - 异常
  - 数据准确性
  severity: S2
  severity_reason: 若可绕过列表限制选中超限设备，规则内员工到岗打卡会直接落到已满员设备上。
  preconditions: 已有一台人数达到上限的智能考勤机，并已知其设备名称；管理后台可打开添加规则页。
  steps:
  - 在添加规则页把打卡方式切换为智能考勤机
  - 在设备列表的搜索框中输入已达上限考勤机的设备名称
  - 尝试勾选搜索结果中的该考勤机，然后保存规则
  expected:
  - 该考勤机不出现在搜索结果中，无法被勾选
  - 规则保存后打卡设备中不含该考勤机
  status: active
  source_context:
    quote: 人数已达上限的考勤机不得出现在可选设备列表中；若已被规则引用后达到上限，需确认打卡是否被拒。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
