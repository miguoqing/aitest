  fp_id: FP-04
  scenario_id: SC-FP-04-02
  point_id: TP-FP-04-02-01
  functional_point: 打卡地点与设备范围校验
  scenario: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用
  test_point: 人数已达上限的考勤机不出现在可选打卡设备列表中，无法被规则选中。
  title: 让已被规则引用的考勤机达到人数上限后在该设备打卡
  design_method: 场景法
  tags:
  - 边界
  - 待确认
  severity: S2
  severity_reason: 达上限后的打卡若无明确口径，员工到岗却无法打卡，或打卡记录被静默丢弃。
  preconditions: 某条智能考勤机规则已把考勤机 M 设为打卡设备；M 当前人数为上限减一；M 上有一名该规则内的员工。
