  scenario_id: SC-FP-04-03
  point_id: TP-FP-04-03-01
  functional_point: 打卡地点与设备范围校验
  scenario: 通过 IT 管理员询问或扫描二维码取得 Wi-Fi 的 MAC 地址/bssid 并录入规则后
  test_point: 员工连上目标 Wi-Fi 后扫描添加 WIFI 页面上的二维码，能取得该 Wi-Fi 的 bssid 地址用于规则配置。
  title: 连上办公 Wi-Fi 后扫码取得 bssid 并填进规则
  design_method: 场景法
  tags:
  - 正向
