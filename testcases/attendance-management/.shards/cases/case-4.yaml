- id: TC-ATT-0409
  fp_id: FP-04
  scenario_id: SC-FP-04-02
  point_id: TP-FP-04-02-02
  functional_point: 打卡地点与设备范围校验
  scenario: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用
  test_point: 考勤机人数超过上限后不能作为打卡设备被规则选中。
  title: 同一台考勤机人数增至上限前后各查一次可选性并尝试保存规则
  design_method: 边界值法
  tags:
  - 边界
  severity: S2
  severity_reason: 上限这一刻的可选性判断错一位，超限设备就会进入规则。
  preconditions: 已接入一台智能考勤机，人数上限为 N，可通过增删员工调整其在册人数。
  steps:
  - 把该考勤机人数调整为 N-1，在添加规则页查看其可选性
  - 把人数调整为恰好 N，刷新后再次查看其可选性
  - 以该设备为打卡设备保存一条智能考勤机规则
  expected:
  - 人数为 N-1 时该设备可被选中
  - 人数恰好为 N 时该设备不可被选中
  - 保存请求被拒绝，规则未绑定该设备
  status: active
  source_context:
    quote: 这里存在容量约束：每台考勤机有相应的人数上限，人数超限的考勤机不能作为打卡设备被选中。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
- id: TC-ATT-0410
  fp_id: FP-04
  scenario_id: SC-FP-04-02
  point_id: TP-FP-04-02-02
  functional_point: 打卡地点与设备范围校验
  scenario: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用
  test_point: 考勤机人数超过上限后不能作为打卡设备被规则选中。
  title: 从未超限与已超限两类设备中各取一台分别设为打卡设备
  design_method: 等价类划分
  tags:
  - 异常
  - 数据准确性
  severity: S2
  severity_reason: 两类设备若得到同一结论，容量约束整体失效，超限打卡会集中落在一台设备上。
  preconditions: 企业内至少有两台智能考勤机：一台人数远未达上限，一台人数已超限；已知各自设备名称。
  steps:
  - 在设备列表中挑出一台人数远未达上限的考勤机和一台人数已超限的考勤机
  - 把未超限的考勤机设为某规则的打卡设备并保存
  - 另建一条规则，尝试把已超限的考勤机设为打卡设备并保存
  expected:
  - 未超限的考勤机被成功设为规则打卡设备
  - 已超限的考勤机无法被选中，保存后该规则未绑定该设备
  status: active
  source_context:
    quote: 这里存在容量约束：每台考勤机有相应的人数上限，人数超限的考勤机不能作为打卡设备被选中。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡地点与打卡范围
