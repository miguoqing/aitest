  - TC-ATT-1302
  source_ref: wiki/attendance-management/special-rules-and-approval.md
- id: OI-05
  question: 提前提醒在下拉列表中可选的取值与最小提前量分别是多少分钟？
  related_case_ids:
  - TC-ATT-1304
  source_ref: wiki/attendance-management/special-rules-and-approval.md
- id: OI-06
  question: 可见范围外的成员通过历史会话或直达链接访问打卡应用时，是必须被拒绝进入，还是仅隐藏工作台入口、仍可访问并提交打卡？
  related_case_ids:
  - TC-ATT-1404
  source_ref: wiki/attendance-management/special-rules-and-approval.md
