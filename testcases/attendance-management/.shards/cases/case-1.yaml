  source_ref: wiki/attendance-management/attendance-rule-configuration.md
- id: OI-03
  question: 同一日期配置两个必须打卡时段时，只完成其中一个时段的员工是单独判该时段缺卡，还是整日合并判为一条缺卡？
  related_case_ids:
  - TC-ATT-1107
  source_ref: wiki/attendance-management/special-rules-and-approval.md
- id: OI-04
  question: 员工在提醒时点前已完成打卡，是否仍会收到该次打卡提醒？
