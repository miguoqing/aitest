  test_point: 员工所在规则为自由上下班且当日完成打卡时，考勤明细中不出现迟到或早退结论。
  title: 用大幅偏离常规工时的打卡时刻反查是否产出迟到早退
  design_method: 逆向场景法
  tags:
  - 异常
