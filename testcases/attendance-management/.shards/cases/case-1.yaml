cases:
- id: TC-ATT-0101
  fp_id: FP-01
  scenario_id: SC-FP-01-01
  point_id: TP-FP-01-01-01
  functional_point: 规则类型与统计口径
  scenario: 同一企业下同时存在固定时间、按班次、自由上下班三条规则且各绑定了对应人员时，验三条规则各自产出的考勤判定口径。
  test_point: 固定时间上下班规则绑定的员工按企业统一时间打卡时，考勤判定取该固定时间，不取排班时间。
  title: 固定时间规则下按三个不同打卡时刻核对迟到与早退判定
  design_method: 等价类划分
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 判定基准取错会让固定时间规则下整批员工的迟到/早退结论失真，并直接进入薪资核算
  preconditions: 已建固定时间上下班规则（上下班时间 09:00–18:00）并绑定测试部门成员；高级设置中允许迟到、早退的分钟数为 5 分钟；员工当日无已通过的请假单据
  steps:
  - 员工于 09:00 打卡上班、18:00 打卡下班
  - 次日该员工于 09:15 打卡上班
  - 第三日该员工于 17:30 打卡下班
  - 管理员进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】，逐日打开该员工考勤明细
  expected:
  - 首日 09:00 上班、18:00 下班：迟到判定与早退判定均为空
  - 次日 09:15 上班：判定为迟到
  - 第三日 17:30 下班：判定为早退
  status: active
  source_context:
    quote: 规则类型决定考勤的统计口径（固定时间、按班次、自由上下班），打卡方式决定打卡凭证的来源（手机定位/Wi-Fi、智能考勤机、传统U盘考勤机导入）。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 三种规则类型
- id: TC-ATT-0102
  fp_id: FP-01
  scenario_id: SC-FP-01-01
  point_id: TP-FP-01-01-01
  functional_point: 规则类型与统计口径
  scenario: 同一企业下同时存在固定时间、按班次、自由上下班三条规则且各绑定了对应人员时，验三条规则各自产出的考勤判定口径。
  test_point: 固定时间上下班规则绑定的员工按企业统一时间打卡时，考勤判定取该固定时间，不取排班时间。
  title: 配置固定时间规则后完成打卡并在后台查看当日考勤结论
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 从规则创建到考勤查看的主链路断开时，管理员无法为固定时间员工建立任何考勤判定
  preconditions: 企业尚无任何打卡规则；测试部门有 1 名成员 A
  steps:
  - 管理员进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【设置】>【添加规则】
  - 规则类型选固定时间上下班，上下班时间设为 09:00–18:00，打卡人员选测试部门，保存规则
  - 成员 A 用手机端完成一次上班打卡与一次下班打卡
  - 管理员进入【查看】打开成员 A 当日考勤明细
  expected:
  - 规则保存后该部门成员当日生成 09:00 与 18:00 两次待打卡要求
  - 成员 A 当日考勤明细中的应打卡时间为 09:00 与 18:00
  - 成员 A 当日考勤明细的判定结论基于 09:00–18:00 产出
  status: active
  source_context:
    quote: 规则类型决定考勤的统计口径（固定时间、按班次、自由上下班），打卡方式决定打卡凭证的来源（手机定位/Wi-Fi、智能考勤机、传统U盘考勤机导入）。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 三种规则类型
- id: TC-ATT-0103
  fp_id: FP-01
  scenario_id: SC-FP-01-01
  point_id: TP-FP-01-01-01
  functional_point: 规则类型与统计口径
  scenario: 同一企业下同时存在固定时间、按班次、自由上下班三条规则且各绑定了对应人员时，验三条规则各自产出的考勤判定口径。
  test_point: 固定时间上下班规则绑定的员工按企业统一时间打卡时，考勤判定取该固定时间，不取排班时间。
  title: 员工同时存在排班与企业统一时间时核对判定取值
  design_method: 因果图法
  tags:
  - 正向
  - 数据一致性
  severity: S2
  severity_reason: 有排班记录时若取排班而不取统一时间，该员工的迟到判定会整月偏移
  preconditions: 已建固定时间上下班规则（09:00–18:00）绑定成员 B；通讯录中成员 B 另有一条 10:00–19:00 的排班记录；容差 5 分钟
  steps:
  - 成员 B 于 09:30 打卡上班、18:00 打卡下班
  - 管理员在【查看】打开成员 B 当日考勤明细
  - 把成员 B 的排班改为 08:00–17:00，重新打开当日考勤明细
  expected:
  - 09:30 上班被判为迟到，判定起点为 09:00 而非 10:00
  - 18:00 下班不被判早退，判定终点为 18:00
  - 排班改为 08:00–17:00 后同一打卡记录仍判迟到，结论不随排班变化
  status: active
  source_context:
    quote: 规则类型决定考勤的统计口径（固定时间、按班次、自由上下班），打卡方式决定打卡凭证的来源（手机定位/Wi-Fi、智能考勤机、传统U盘考勤机导入）。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 三种规则类型
