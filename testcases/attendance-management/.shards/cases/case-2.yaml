  fp_id: FP-02
  scenario_id: SC-FP-02-03
  point_id: TP-FP-02-03-01
  functional_point: 打卡人员范围与白名单豁免
  scenario: 同一员工在 A 规则白名单内、同时又属于 B 规则打卡人员时，验豁免是否只作用于 A 规则。
  test_point: 同一员工在 A 规则白名单内、同时属于 B 规则打卡人员时，A 规则的豁免不解除其在 B 规则的打卡要求。
  title: 反向验证 A 规则白名单不会免除 B 规则的打卡
  design_method: 逆向场景法
  tags:
  - 异常
  - 数据准确性
