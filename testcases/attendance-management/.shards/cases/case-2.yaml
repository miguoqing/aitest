- id: TC-ATT-0201
  fp_id: FP-02
  scenario_id: SC-FP-02-01
  point_id: TP-FP-02-01-01
  functional_point: 打卡人员范围与白名单豁免
  scenario: 规则以部门加具体成员的混合方式划定打卡人员时，验集合内成员受约束、集合外成员不受约束的边界。
  test_point: 规则同时选到部门与具体成员时，集合内成员按该规则参与打卡，同部门但不在集合内的成员不受该规则约束。
  title: 按集合内与集合外两类成员核对打卡要求归属
  design_method: 等价类划分
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 集合外成员一旦被纳入规则，会被按该规则批量判缺卡，整批考勤结论失真且事后难以逐条追溯
  preconditions: 已创建规则 R1，打卡人员同时选中「销售部」部门与成员「张三」（张三不属于销售部）；李四属销售部，王五既不在销售部也未被单独选中；当日为工作日
  steps:
  - 以管理员身份进入【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【设置】并打开规则 R1 的人员设置
  - 核对打卡人员集合中的成员条目
  - 分别以张三、李四、王五的账号进入手机端打卡页，查看出现的待打卡项
  - 进入【打卡记录】按规则 R1 查看三人当日状态
  expected:
  - 打卡人员集合同时包含销售部全员与张三
  - 张三、李四的打卡页出现 R1 的待打卡项，王五的打卡页不出现 R1 的待打卡项
  - 王五的打卡不被计入规则 R1 的记录
  status: active
  source_context:
    quote: 打卡人员是「适用于该条打卡规则的部门和成员」的集合，既可以选到部门，也可以选到具体成员。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡人员
- id: TC-ATT-0202
  fp_id: FP-02
  scenario_id: SC-FP-02-01
  point_id: TP-FP-02-01-01
  functional_point: 打卡人员范围与白名单豁免
  scenario: 规则以部门加具体成员的混合方式划定打卡人员时，验集合内成员受约束、集合外成员不受约束的边界。
  test_point: 规则同时选到部门与具体成员时，集合内成员按该规则参与打卡，同部门但不在集合内的成员不受该规则约束。
  title: 用混合划定的规则走完打卡到查看记录的主链路
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 集合内成员打卡后记录未按本规则归集，该规则下的打卡主链路整体失效
  preconditions: 销售部为测试部门，张三为销售部外的单独成员；管理员具备规则配置权限；当日为工作日
  steps:
  - 在管理后台创建规则 R1，打卡人员同时选中部门「销售部」与成员「张三」
  - 以张三账号在手机端完成一次上班打卡
  - 以销售部成员李四的账号在手机端完成一次上班打卡
  - 进入【打卡记录】按规则 R1 筛选当日记录
  expected:
  - 张三与李四的两条打卡记录都归属规则 R1
  - 筛选结果中不出现非集合成员的打卡记录
  status: active
  source_context:
    quote: 打卡人员是「适用于该条打卡规则的部门和成员」的集合，既可以选到部门，也可以选到具体成员。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 打卡人员
- id: TC-ATT-0203
  fp_id: FP-02
  scenario_id: SC-FP-02-01
  point_id: TP-FP-02-01-01
  functional_point: 打卡人员范围与白名单豁免
  scenario: 规则以部门加具体成员的混合方式划定打卡人员时，验集合内成员受约束、集合外成员不受约束的边界。
  test_point: 规则同时选到部门与具体成员时，集合内成员按该规则参与打卡，同部门但不在集合内的成员不受该规则约束。
  title: 叠加部门选中与成员选中两条路径后核对集合成员
  design_method: 因果图法
  tags:
  - 正向
  - 数据一致性
  severity: S3
  severity_reason: 重复选中只让同一成员在待打卡名单里多出一条，人工去重即可，不改变成员是否受该规则约束
  preconditions: 销售部含李四等成员；规则 R1 先只选中部门「销售部」，随后又把销售部成员李四单独加入同一规则
  steps:
  - 创建规则 R1 并先选中部门「销售部」
  - 再把销售部成员李四单独加入规则 R1 的打卡人员
  - 打开 R1 的人员设置核对集合成员条目
  - 在当日待打卡名单中查看李四的条目
  expected:
  - 集合成员等于销售部全员与单独选中成员的并集
  - 李四在集合中只有一条成员条目
  - 李四当日的待打卡项只有一条
  status: active
  source_context:
    quote: 打卡人员是「适用于该条打卡规则的部门和成员」的集合，既可以选到部门，也可以选到具体成员。
