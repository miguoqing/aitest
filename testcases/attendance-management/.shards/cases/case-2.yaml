- id: TC-ATT-0206
  fp_id: FP-02
  scenario_id: SC-FP-02-02
  point_id: TP-FP-02-02-01
  functional_point: 打卡人员范围与白名单豁免
  scenario: 员工处于规则白名单内且当日无打卡记录时，验其在待打卡名单与异常名单中的呈现。
  test_point: 白名单内的员工当日无打卡记录时，不出现在待打卡名单与异常名单中。
  title: 从白名单员工被计入缺卡反推名单呈现
  design_method: 逆向场景法
  tags:
  - 异常
  - 数据准确性
  severity: S2
  severity_reason: 白名单员工一旦出现在异常名单，其单日结论需要人工改判，且会拉高该日异常数
  preconditions: 规则 R3 的白名单含成员周八；周八当日无任何打卡记录；非白名单成员吴九当日也无打卡记录；当日为工作日
  steps:
  - 保持周八当日不打卡
  - 进入【打卡记录】按当日查看异常名单
  - 查看规则 R3 在当日的待打卡名单
  - 在同一页面查看吴九的名单条目作为对照
  expected:
  - 周八不出现在待打卡名单
  - 周八不出现在异常名单，其当日不被计为缺卡
  - 吴九作为非白名单成员按未打卡被列入待打卡名单
  status: active
  source_context:
    quote: 白名单内的员工不参与打卡，且不得出现在待打卡/异常名单中。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 可测试的关键判定点
