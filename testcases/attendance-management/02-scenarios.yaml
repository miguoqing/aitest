  - 异常
- id: SC-FP-13-01
  fp_id: FP-13
  name: 提醒时间配置后的提醒送达
  description: 在打卡规则的提醒下拉列表已选定提醒时间、员工在指定时间前尚未打卡的条件下，验提醒消息的送达时点与接收对象。
  basis: 「打卡提醒」（下拉列表选择提醒时间、届时企业微信收到提醒）
