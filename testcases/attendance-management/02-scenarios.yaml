scenarios:
- id: SC-FP-01-01
  fp_id: FP-01
  name: 三类规则的统计口径并存
  description: 同一企业下同时存在固定时间、按班次、自由上下班三条规则且各绑定了对应人员时，验三条规则各自产出的考勤判定口径。
  basis: 文档「三种规则类型」表格对三类口径与统计特性的定义
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-01-02
  fp_id: FP-01
  name: 自由上下班规则下的迟到早退判定
  description: 员工所在规则为自由上下班、当日有或没有打卡记录时，验系统是否仍产出迟到或早退结论。
  basis: 文档「可测试的关键判定点」第一条对自由上下班的限制
  focus:
  - 异常
  - 数据准确性
- id: SC-FP-01-03
  fp_id: FP-01
  name: 按工作性质分派后的口径隔离
  description: 设备运维部门套按班次上下班、销售部套自由上下班之后，验两个部门的考勤判定口径是否互不串用。
  basis: 文档「打卡人员」段落给出的按工作性质分派典型组合
  focus:
  - 正向
  - 数据一致性
