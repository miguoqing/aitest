  - 正向
  - 数据准确性
- id: SC-FP-11-02
  fp_id: FP-11
  name: 必须打卡日期的缺卡判定
  description: 在某日期被设置为必须打卡、且员工在该日配置时段内没有打卡记录的条件下，验该日是否被判定为缺卡异常。
  basis: 「特殊日期打卡」与「可测试的关键判定点」第五条（必须打卡后缺卡应判定为异常）
