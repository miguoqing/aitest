  focus:
  - 负向
  - 安全
- id: SC-FP-23-03
  fp_id: FP-23
  name: 空时间范围与无数据区间的接口返回
  description: 请求的时间范围内不存在任何打卡记录时，验证接口返回结构与非空字段的表达方式
  basis: 文档「可测试的关键判定点」中同口径一致条款在无数据区间上的边界取值
  focus:
  - 边界
  - 数据准确性
- id: SC-FP-24-01
  fp_id: FP-24
  name: 未分配管辖范围的新增分级管理员
  description: 新增分级管理员时管辖范围为空、尚未分配任何部门，验证其规则修改权限的有无
