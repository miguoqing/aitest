  fp_id: FP-24
  name: 补充分配管辖范围后获得范围内权限
  description: 分级管理员的管辖范围已完成补充分配、范围外另有其他部门时，验证其获得范围内规则修改权限的条件
  basis: 文档「可测试的关键判定点」中范围内规则可操作的规定，与未分配范围的边界形成对照
  focus:
  - 正向
  - 权限
