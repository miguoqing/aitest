  - 异常
  - 数据准确性
- id: SC-FP-11-03
  fp_id: FP-11
  name: 同一日期多时段与打卡事由
  description: 在同一日期配置两个打卡时段并分别填写打卡事由的条件下，验各时段的生效范围与缺卡判定是否逐时段独立成立。
  basis: 「特殊日期打卡」（同一日期如需多个时间，可新增时段）
  focus:
  - 正向
  - 边界
- id: SC-FP-12-01
  fp_id: FP-12
  name: 开启后非工作日签到的记录
  description: 在「非工作日允许打卡」开启、员工于非工作日自由签到的条件下，验工作时长的记录结果与异常判定结果。
