  - 边界
- id: SC-FP-17-01
  fp_id: FP-17
  name: 超级管理员的规则设置覆盖全员
  description: 账号为超级管理员且企业内存在多个部门与员工时，验证规则设置范围与统计查看范围是否以全员为界
