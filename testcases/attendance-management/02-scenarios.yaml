  - 正向
- id: SC-FP-13-02
  fp_id: FP-13
  name: 准点与提前两类提醒时点
  description: 在提醒取值分别为准点提醒与提前提醒的条件下，验两类提醒的触达时点与打卡时间的先后关系。
  basis: 「打卡提醒」（打卡时间准点或提前提醒）
  focus:
  - 边界
  - 数据准确性
- id: SC-FP-14-01
  fp_id: FP-14
  name: 默认所有人可见
  description: 在打卡应用未做过可见范围配置的条件下，验通讯录内成员在手机端能否看到并使用打卡应用入口。
