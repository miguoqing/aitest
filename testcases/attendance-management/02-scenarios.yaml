  fp_id: FP-02
  name: 部门与成员混合划定的适用范围
  description: 规则以部门加具体成员的混合方式划定打卡人员时，验集合内成员受约束、集合外成员不受约束的边界。
  basis: 文档「打卡人员」段落对集合构成的说明
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-02-02
  fp_id: FP-02
  name: 白名单员工的打卡名单呈现
  description: 员工处于规则白名单内且当日无打卡记录时，验其在待打卡名单与异常名单中的呈现。
  basis: 文档「可测试的关键判定点」第二条对白名单员工的要求
  focus:
  - 异常
  - 数据准确性
- id: SC-FP-02-03
  fp_id: FP-02
  name: 白名单豁免的作用范围
  description: 同一员工在 A 规则白名单内、同时又属于 B 规则打卡人员时，验豁免是否只作用于 A 规则。
  basis: 文档「打卡人员」段落对白名单是规则级豁免的定性
  focus:
  - 权限
  - 数据一致性
- id: SC-FP-03-01
  fp_id: FP-03
  name: 手机打卡凭证满足其一即产生记录
  description: 员工仅定位在有效范围内、或仅连上办公 Wi-Fi 时，验手机端是否直接产生打卡记录。
  basis: 文档「三种打卡方式」表格手机打卡行与「打卡地点与打卡范围」第一条
  focus:
  - 正向
  - 集成
- id: SC-FP-03-02
  fp_id: FP-03
  name: 智能考勤机的指定设备打卡
  description: 规则按设备名称选定智能考勤机后，验规则内人员在指定设备与非指定设备上打卡的记录归属差异。
  basis: 文档对智能考勤机方式只能指定设备打卡的约束
  focus:
  - 异常
  - 数据准确性
- id: SC-FP-03-03
  fp_id: FP-03
  name: U盘导入的离线采集与批量核算
  description: 仍使用传统U盘考勤机的企业先导出通讯录、再定期把打卡记录导回时，验系统按所设规则核算这批记录的情况。
  basis: 文档对 U盘导入是先离线采集后批量导入唯一路径的说明
  focus:
  - 正向
  - 集成
- id: SC-FP-04-01
  fp_id: FP-04
  name: 打卡范围 100 至 300 米的边界
  description: 办公地点周边 100 米与 300 米两处定位打卡，以及不同打卡地点各自的边界时，验有效范围的生效情况。
  basis: 文档「打卡地点与打卡范围」对 100 至 300 米有效范围的说明与关键判定点第四条
  focus:
  - 边界
  - 数据准确性
- id: SC-FP-04-02
  fp_id: FP-04
  name: 智能考勤机的设备与人数上限
  description: 规则内人员在非指定考勤机上打卡、以及考勤机人数达到上限后被选中或已被规则引用时，验设备约束的生效情况。
  basis: 文档「打卡地点与打卡范围」末段的容量约束与关键判定点第五条
  focus:
  - 异常
  - 边界
- id: SC-FP-04-03
  fp_id: FP-04
  name: Wi-Fi 凭证的获取与校验
  description: 通过 IT 管理员询问或扫描二维码取得 Wi-Fi 的 MAC 地址/bssid 并录入规则后，验员工连上该 Wi-Fi 时的打卡放行。
  basis: 文档「打卡地点与打卡范围」对 WIFI 打卡凭证的要求
  focus:
  - 正向
  - 可用性
- id: SC-FP-05-01
  fp_id: FP-05
  name: 迟到容差阈值的触发点
  description: 规则设定允许迟到 N 分钟后，员工在应上班时间之后第 N 分钟与第 N+1 分钟打卡时，验迟到判定的触发点。
  basis: 文档「上下班时间与容差」对容差阈值决定迟到/早退判定触发点的说明
  focus:
  - 边界
  - 异常
- id: SC-FP-05-02
  fp_id: FP-05
  name: 早退容差阈值的触发点
  description: 规则设定允许早退 N 分钟后，员工在应下班时间之前第 N 分钟与第 N+1 分钟打卡时，验早退判定的触发点。
  basis: 文档在高级设置中把迟到与早退分钟数并列设定
  focus:
  - 正向
  - 边界
- id: SC-FP-06-01
  fp_id: FP-06
  name: 外出打卡的定位与拍照依据
  description: 出差外勤成员无法在办公区域打卡时，在手机客户端上传位置定位并拍照，验该次外出打卡是否成立。
  basis: 文档「外出打卡」段落对打卡依据的说明
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-06-02
  fp_id: FP-06
  name: 启用只能拍照后的相册路径
  description: 规则启用照片来源限制后，外出人员分别从相册选取图片与现场拍照提交，验相册路径的可提交性。
  basis: 文档「外出打卡」段落与「可测试的关键判定点」第六条
  focus:
  - 安全
  - 异常
- id: SC-FP-09-01
  fp_id: FP-09
  name: 未强制拍照时的无照片打卡
  description: 在打卡规则未勾选「员工打卡必须拍照」、员工提交的打卡不带照片的条件下，验该次打卡的受理结论与当日考勤记录内容。
  basis: 「拍照打卡」与「可测试的关键判定点」第一条（未勾选时无照片打卡应能通过）
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-09-02
  fp_id: FP-09
  name: 强制拍照下的缺照片打卡
  description: 在打卡规则勾选「员工打卡必须拍照」、打卡请求不携带照片的条件下，验该次打卡是否被拒绝以及当日该时段的状态。
  basis: 「拍照打卡」（可要求打卡时必须拍照）与「可测试的关键判定点」第一条（勾选后缺照片必须被拒绝）
  focus:
  - 异常
  - 边界
- id: SC-FP-09-03
  fp_id: FP-09
  name: 异常备注图片来源限制
  description: 在勾选「备注不允许上传本地图片，只能拍照」的规则下，分别以本地相册图片和现场拍摄作为异常打卡备注图片来源，验备注提交的受理结论。
  basis: 「拍照打卡」配套强约束与「可测试的关键判定点」第二条
  focus:
  - 异常
  - 安全
- id: SC-FP-10-01
  fp_id: FP-10
  name: 补卡审批通过后的状态校正
  description: 在补卡开关已开启、员工对迟到或早退异常提交补卡申请且上级审批通过的条件下，验打卡状态的最终取值与校准结果的展示位置。
  basis: 「补卡申请」两条联动结果与「可测试的关键判定点」第四条
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-10-02
  fp_id: FP-10
  name: 补卡审批未通过时的状态保持
  description: 在补卡申请已提交但审批未通过、或仍在流转中的条件下，验原异常打卡状态是否保持不变。
  basis: 「可测试的关键判定点」第三条（审批未通过时打卡状态不得变化）
  focus:
  - 异常
  - 数据一致性
- id: SC-FP-10-03
  fp_id: FP-10
  name: 补卡开关关闭时的入口与审批前置
  description: 在打卡规则未勾选补卡申请开关的条件下，验【审批】应用中是否存在补卡申请入口，以及是否存在绕过上级审批直接改变打卡状态的路径。
  basis: 「补卡申请」两条联动结果与「不存在跳过审批环节的路径」
  focus:
  - 权限
  - 异常
- id: SC-FP-11-01
  fp_id: FP-11
  name: 不用打卡日期的异常判定
  description: 在某日期被设置为「不用打卡」且员工当日没有任何打卡记录的条件下，验该日是否产生考勤异常。
  basis: 「可测试的关键判定点」第五条（不用打卡后该日不产生异常）
