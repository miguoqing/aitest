  fp_id: FP-20
  name: 分级管理员在管辖范围内的可见与可操作
  description: 分级管理员的管辖范围已分配、范围外另有其他部门与员工时，验证范围内规则与统计的可见性与可操作性
  basis: 文档「可测试的关键判定点」中分级管理员只能操作管辖范围内的规则与统计
  focus:
  - 正向
  - 权限
- id: SC-FP-20-02
  fp_id: FP-20
  name: 范围外对象的可见性
  description: 分级管理员的管辖范围外存在其他部门与员工时，验证这些对象在其视图与列表中的暴露情况
  basis: 文档「可测试的关键判定点」中范围外的部门/员工必须不可见
  focus:
  - 负向
  - 权限
- id: SC-FP-20-03
  fp_id: FP-20
  name: 绕过界面直接触达范围外对象
  description: 分级管理员身份下的数据请求不经界面入口、指向范围外的规则与统计数据时，验证服务端的拦截
  basis: 文档「可测试的关键判定点」中范围外的部门/员工必须不可见或不可操作
  focus:
  - 逆向
  - 安全
- id: SC-FP-21-01
  fp_id: FP-21
  name: 单一筛选条件的结果
  description: 打卡记录同时存在多个部门、多名人员与多种打卡状态时，验证按时间、部门、打卡人员、打卡状态中任一单条件筛选后的结果集合
  basis: 文档「查看与导出打卡记录」中顶部工具栏可按时间、部门、打卡人员、打卡状态筛选
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-21-02
  fp_id: FP-21
  name: 多条件组合的交集
  description: 时间、部门、打卡人员、打卡状态四个条件同时生效时，验证结果集是否为各条件结果的交集
  basis: 文档「可测试的关键判定点」中筛选条件组合使用时结果应取交集
  focus:
  - 正向
  - 数据准确性
- id: SC-FP-21-03
  fp_id: FP-21
  name: 无匹配结果与极端条件组合
  description: 筛选条件组合在数据集中不存在任何匹配记录、或某维度取空值时，验证结果集与界面呈现
  basis: 文档「可测试的关键判定点」中交集规则在无匹配数据时的边界取值
  focus:
  - 边界
  - 异常
- id: SC-FP-22-01
  fp_id: FP-22
  name: 按日统计 Tab 的导出内容
  description: 「按日统计」Tab 处于某一组筛选条件下时，验证导出 Excel 的记录范围与统计口径
  basis: 文档「查看与导出打卡记录」中导出条目与两份导出数据须与对应 Tab 一致
  focus:
  - 正向
  - 导出
- id: SC-FP-22-02
  fp_id: FP-22
  name: 按月统计 Tab 的导出内容
  description: 「按月统计」Tab 处于某一组筛选条件下时，验证导出 Excel 的月度汇总口径与记录范围
  basis: 文档「可测试的关键判定点」中按日与按月两份导出数据须分别与对应 Tab 一致
  focus:
  - 正向
  - 导出
- id: SC-FP-22-03
  fp_id: FP-22
  name: 筛选条件变更后的重复导出
  description: 同一组筛选条件下的导出与变更条件后的导出两个时点，验证导出内容与各自筛选条件的对应关系
  basis: 文档「可测试的关键判定点」中导出数据须与对应 Tab 及筛选条件一致
  focus:
  - 边界
  - 数据一致性
- id: SC-FP-23-01
  fp_id: FP-23
  name: API 导出与后台导出的口径比对
  description: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  basis: 文档「可测试的关键判定点」中 API 导出数据应与后台导出在相同时间范围下口径一致
