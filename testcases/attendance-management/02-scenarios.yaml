- id: SC-FP-15-02
  fp_id: FP-15
  name: 非工作日加班卡与加班申请匹配后的校准
  description: 在员工非工作日打了 10 小时加班卡、且当日存在已通过加班申请的条件下，验校准后该日状态的取值。
