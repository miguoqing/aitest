  - 正向
  - 数据准确性
- id: SC-FP-12-02
  fp_id: FP-12
  name: 关闭时非工作日打卡的受理结论
  description: 在「非工作日允许打卡」关闭、员工于非工作日发起打卡的条件下，验系统对本次打卡的受理结论与是否计入考勤统计。
  basis: 「可测试的关键判定点」第六条（关闭时非工作日打卡应被拒绝或不计入）
