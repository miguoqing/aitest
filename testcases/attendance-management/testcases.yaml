  scenario: 调用方为非管理员或未获授权的应用时，验证接口对调用方身份的访问控制
  test_point: 非管理员或未获授权的应用调用导出接口时被拒绝，响应中不含任何打卡数据。
  title: 分别用随机令牌、已过期令牌、已吊销应用的密钥调用导出接口
  design_method: 异常法
  tags:
  - 异常
  - 安全
  severity: S1
  severity_reason: 失效凭证仍能取数时，任何拿到旧令牌或离职应用密钥的人都能持续导出全员考勤，吊销动作形同失效。
  preconditions: 已准备三个无效凭证：随机字符串令牌、签发已过期的令牌、已吊销应用的 corpsecret；全员 2026-09 打卡数据已存在。
  steps:
