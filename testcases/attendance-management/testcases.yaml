  point_id: TP-FP-24-02-01
  functional_point: 未分配管辖范围的权限边界
  scenario: 分级管理员的管辖范围已完成补充分配、范围外另有其他部门时，验证其获得范围内规则修改权限的条件
  test_point: 同一分级管理员在补充分配管辖范围后获得范围内的规则修改权限，且权限不溢出该范围。
  title: 在范围边界内外两侧核对修改权限
  design_method: 边界值法
  tags:
  - 边界
  - 权限
  severity: S2
  severity_reason: 权限边界没有落在范围边界上时，范围外规则会被一并改动，分级管理员的越权面直接扩大
  preconditions: 分级管理员甲已由超级管理员补充分配管辖范围，范围只含「财务部」；公司另有「销售部」及其在用规则
  steps:
  - 以甲账号进入【上下班打卡】>【设置】，修改财务部的一条规则并保存
  - 以甲账号尝试修改销售部的一条规则并保存
  - 由超级管理员核对两条规则的内容
  expected:
  - 财务部规则的修改保存成功，内容按甲的修改更新
  - 销售部规则的修改未保存，内容与修改前一致
  status: active
  source_context:
