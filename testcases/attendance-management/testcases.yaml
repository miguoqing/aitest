  title: 在三个不同时段打卡核对自由上下班规则的受理结果
  design_method: 等价类划分
  tags:
  - 正向
  - 数据准确性
  severity: S2
  severity_reason: 打卡被时间限制后自由上下班员工无法在非标准时段打卡，出勤数据缺失
  preconditions: 已建自由上下班规则并绑定成员 C；三日均为工作日
  steps:
  - 成员 C 于 07:30 打卡上班与下班
  - 次日成员 C 于 13:00 打卡上班与下班
  - 第三日成员 C 于 22:15 打卡上班与下班
  - 管理员在【查看】逐日打开成员 C 的考勤明细
  expected:
  - 三个时段的打卡均被受理并生成打卡记录
  - 三日的旷工统计均为 0
  - 三日均不出现迟到、早退判定
  status: active
  source_context:
    quote: 自由上下班只统计旷工，工作时长仅作记录，不按固定时间判定上下班。
    path: wiki/attendance-management/attendance-rule-configuration.md
    section: 三种规则类型
