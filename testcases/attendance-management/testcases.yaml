  - 上级 B 在【审批】应用中审批通过该补卡申请
  - 在【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】中打开 A 当日打卡记录
  expected:
  - 审批通过后 A 当日打卡状态由迟到异常变为正常
  - A 当日不再计入迟到异常条数
  status: active
  source_context:
    quote: 审批通过后，系统自动将异常打卡状态校正为正常。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 补卡申请
