  test_point: 同一时间范围下 API 导出的打卡记录与后台 Excel 导出的记录逐条一致。
  title: 取同一整月区间，按员工当月打卡记录的三种覆盖程度分别比对两侧记录条数
  design_method: 等价类划分
  tags:
  - 数据一致性
  - 导出
  severity: S1
  severity_reason: 两侧记录条数或有记录日期不一致时，工资与假期结算会按错误的天数计算，且出错后无法从导出结果判断该以哪一侧为准。
  preconditions: 2026-09-01 至 2026-09-30 的后台导出可用；同一部门下准备员工 A（当月每天上下班各一次）、员工 B（当月 10 天有记录、其余日期缺卡）、员工 C（当月无任何打卡）；持有超级管理员 access_token。
  steps:
  - 在【管理后台】>【企业应用】>【打卡】>【上下班打卡】>【查看】>【按日统计】导出 2026-09-01 至 2026-09-30 的 Excel
  - 用超级管理员 access_token 调用打卡数据导出接口，请求同一区间 2026-09-01 至 2026-09-30
  - 把两份结果分别按员工 A、B、C 分组，统计每人的记录条数与有记录的日期
  - 逐个员工比对两侧的条数与有记录日期集合
  expected:
  - 员工 A：两侧各返回 30 天上下班记录，条数相同且有记录日期完全一致
  - 员工 B：两侧记录条数相同，有记录的 10 个日期完全相同
  - 员工 C：两侧都不返回该员工的打卡记录，均未退化为返回全公司数据
  status: active
  source_context:
    quote: API 导出数据应与后台导出在相同时间范围下口径一致。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
