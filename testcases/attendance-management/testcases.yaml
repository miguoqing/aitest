  scenario_id: SC-FP-23-01
  point_id: TP-FP-23-01-02
  functional_point: API 导出通道与后台口径一致
  scenario: 同一时间范围内分别经 API 接口与后台 Excel 导出打卡数据时，验证两侧的记录与统计口径
  test_point: API 导出与后台导出互为并列通道，调用 API 不改变后台导出内容，后台侧的导出记录也不改变 API 的返回结果。
  title: 以远超常规的频率循环调用导出接口并同时执行后台导出
  design_method: 错误推测法
  tags:
  - 待确认
  - 集成
  severity: S3
  severity_reason: 调用频次上限未定义时，集成方无法判断批量取数何时被限流，也无法判断限流是否连带影响后台导出通道。
  preconditions: 可连续发送接口请求的脚本已就绪；超级管理员 access_token 可用。
  steps:
  - 用脚本在 60 秒内调用导出接口 60 次，每次请求 2026-09-01 至 2026-09-30
  - 记录是否有调用被拒绝或进入排队
  - 在被拒绝的那次之后立即执行一次后台 Excel 导出
  expected:
  - 待确认：导出接口是否有调用频次或并发上限？触发上限时是返回限流错误还是排队等待，且是否会影响同一时刻的后台 Excel 导出？
  status: pending_confirmation
  source_context:
    quote: 这条路径与后台 Excel 导出是并列通道，面向的是系统间集成而非人工核对。
    path: wiki/attendance-management/permissions-and-export.md
    section: API 导出数据
- id: TC-ATT-2310
  fp_id: FP-23
  scenario_id: SC-FP-23-02
  point_id: TP-FP-23-02-01
  functional_point: API 导出通道与后台口径一致
  scenario: 调用方为非管理员或未获授权的应用时，验证接口对调用方身份的访问控制
  test_point: 非管理员或未获授权的应用调用导出接口时被拒绝，响应中不含任何打卡数据。
  title: 用一名无管理员身份的普通员工 access_token 调用导出接口请求全员整月数据
  design_method: 安全性法
  tags:
  - 安全
  - 权限
  severity: S1
  severity_reason: 非管理员经接口取到全员打卡记录时，考勤数据与定位地点越权外泄，且泄露不留后台操作痕迹，事后无法定位是谁取的数。
  preconditions: 已取得公司内一名普通员工的 access_token，该员工无任何管理员身份；全员 2026-09 打卡数据已存在。
  steps:
  - 用该员工的 access_token 调用打卡数据导出接口，请求 2026-09-01 至 2026-09-30 的全员记录
  - 读取响应状态与响应体
  - 在后台任取一名其他员工的打卡记录，与响应体中的时间、地点字段做比对
  expected:
  - 该调用未成功，响应为错误而非打卡记录集合
  - 响应体中不出现任何员工的打卡时间与打卡地点
  - 无法从响应体还原出任意一条他人打卡记录
  status: active
  source_context:
    quote: 企业微信提供 API 接口，管理员可通过接口调用导出打卡数据，并结合企业的假期管理、工资结算系统高效输出薪酬报表。
    path: wiki/attendance-management/permissions-and-export.md
    section: API 导出数据
- id: TC-ATT-2311
  fp_id: FP-23
  scenario_id: SC-FP-23-02
  point_id: TP-FP-23-02-01
  functional_point: API 导出通道与后台口径一致
  scenario: 调用方为非管理员或未获授权的应用时，验证接口对调用方身份的访问控制
  test_point: 非管理员或未获授权的应用调用导出接口时被拒绝，响应中不含任何打卡数据。
  title: 在普通员工令牌的请求体里补上管理员的 role、userid、department 参数后重新调用
  design_method: 逆向场景法
  tags:
  - 安全
  - 权限
  severity: S1
  severity_reason: 鉴权若取信于请求参数，任何持有普通令牌的调用方都能自行声明管理员身份导出全员考勤，越权不需要任何额外凭证。
  preconditions: 已取得普通员工 access_token；已知管理员请求样例包含 role、userid、department 三个参数；全员 2026-09 打卡数据已存在。
  steps:
  - 以普通员工令牌为基础，构造与管理员样例一致的请求体，role 填 admin、userid 填超管 ID、department 填全员
  - 调用导出接口请求 2026-09-01 至 2026-09-30 的全员记录
  - 把 role 改填 super_admin 后再调用一次
  - 读取两次调用的响应状态与响应体
  expected:
  - 两次调用都按令牌对应的普通员工身份被拒绝
  - 两次响应体都不含任何打卡记录
  - 改写 role 与 userid 参数不改变拒绝结果
  status: active
  source_context:
    quote: 企业微信提供 API 接口，管理员可通过接口调用导出打卡数据，并结合企业的假期管理、工资结算系统高效输出薪酬报表。
    path: wiki/attendance-management/permissions-and-export.md
    section: API 导出数据
