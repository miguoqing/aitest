  scenario_id: SC-FP-24-01
  point_id: TP-FP-24-01-01
  functional_point: 未分配管辖范围的权限边界
  scenario: 新增分级管理员时管辖范围为空、尚未分配任何部门，验证其规则修改权限的有无
