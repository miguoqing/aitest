- id: TC-ATT-1501
  fp_id: FP-15
  scenario_id: SC-FP-15-01
  point_id: TP-FP-15-01-01
  functional_point: 审批数据关联与异常校准
  scenario: 员工上班早退 2 小时、且存在同一时间段 2 小时已通过事假
  test_point: 员工上班早退 2 小时且存在同一时间段 2 小时已通过事假时，其当日打卡状态被校准为「正常」。
  title: 早退 2 小时后用同时段 2 小时事假走完审批并查校准状态
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 校准未发生或结果错误时员工被记为早退，考勤结论与审批事实相反，直接影响薪资核算。
  preconditions: 请假审批模板已在【审批】中启用；员工所属规则为固定时间上下班；员工当日上班并按规则早退 2 小时。
  steps:
  - 员工当日提前 2 小时下班打卡，确认打卡记录中出现早退异常
  - 员工提交同一时间段 2 小时的事假申请，由上级审批通过
  - 在【打卡记录】>【校准状态】中查看该员工当日状态
  expected:
  - 该员工当日打卡状态为「正常」
  - 【校准状态】中出现该日期的校准记录
  status: active
  source_context:
    quote: 两个例子共同的前提是「审批是否匹配」：匹配即校准，未匹配的异常状态保持原样。
    path: wiki/attendance-management/special-rules-and-approval.md
    section: 打卡与审批的关联
