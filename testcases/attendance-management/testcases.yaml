  scenario: 在补卡开关已开启、员工对迟到或早退异常提交补卡申请且上级审批通过的条件下，验打卡状态的最终取值与校准结果的展示位置。
  test_point: 补卡申请审批通过后，该员工当日被打上异常标记的打卡状态被系统自动校正为正常。
  title: 员工提交补卡申请并由上级审批通过后查看当日打卡状态
  design_method: 场景法
  tags:
  - 正向
  - 数据准确性
  severity: S1
  severity_reason: 审批通过后状态未校正会让补卡白做，迟到结论错误地进入考勤汇总与后续薪酬核对，且事后无法从记录中区分是未校准还是校准失败。
  preconditions: 打卡规则已勾选「员工异常打卡时可提交申请，审批通过后修正异常」；员工 A 当日上班迟到形成异常打卡记录；A 的上级 B 已被配置为该单据的审批人。
  steps:
