- id: TC-ATT-2401
  fp_id: FP-24
  scenario_id: SC-FP-24-01
  point_id: TP-FP-24-01-01
  functional_point: 未分配管辖范围的权限边界
  scenario: 新增分级管理员时管辖范围为空、尚未分配任何部门，验证其规则修改权限的有无
  test_point: 新增分级管理员且管辖范围为空时，其规则修改权限为空，任一规则修改入口都无法完成修改。
  title: 以零个与一个部门两个边界点核对规则修改权限
  design_method: 边界值法
  tags:
  - 边界
  - 权限
  severity: S2
  severity_reason: 范围为空被当成有范围处理时，该管理员可改动其管辖范围外的规则，权限边界随配置边界一起失守
  preconditions: 已通过【管理后台】>【我的企业】>【权限管理】>【添加系统管理员】>【设置管理员信息】新增分级管理员「甲」且管辖范围为空；财务部有在用规则；公司存在多条打卡规则
  steps:
  - 以甲账号进入【上下班打卡】>【设置】，修改其中一条规则并点击保存
  - 由超级管理员把甲的管辖范围设为只含「财务部」
  - 以甲账号再次修改财务部的一条规则并保存
  expected:
  - 管辖范围为空时，甲的修改无法保存，规则内容与修改前一致
  - 管辖范围只含财务部时，甲对财务部规则的修改可以保存
  status: active
  source_context:
    quote: 新增的分级管理员未分配管辖范围时，不应具备任何规则修改权限（边界场景，需按实际产品行为确认）。
    path: wiki/attendance-management/permissions-and-export.md
    section: 可测试的关键判定点
